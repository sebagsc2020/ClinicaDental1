<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Dental · Panel Completo</title>

  <style>
    /* ===== Variables y reset ===== */
    :root {
      --primary: #355063;
      --primary-dark: #1e2d3a;
      --accent: #4285F4;
      --accent-dark: #2b6ed7;
      --accent-light: #e8f0fe;
      --text: #1e2d3a;
      --text-muted: #64748b;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --white: #ffffff;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #f59e0b;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== Topnav ===== */
    .topnav {
      background: var(--primary);
      color: #fff;
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topnav .logo { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .topnav .logo span { font-weight: 300; }
    .topnav .nav-links { display: flex; gap: 8px; margin-left: 24px; }
    .topnav .nav-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: var(--radius);
      transition: 0.2s;
    }
    .topnav .nav-links a:hover,
    .topnav .nav-links a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .topnav .nav-right { display: flex; align-items: center; gap: 16px; }
    .topnav .nav-clinic { font-size: 13px; opacity: 0.8; }
    .topnav .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff;
    }
    .topnav .user-menu-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .topnav .nav-user-text { text-align: right; line-height: 1.2; }
    .topnav .nav-user-text div:last-child { font-size: 11px; opacity: 0.6; }
    .topnav .user-dropdown {
      display: none; position: absolute; right: 0; top: 100%;
      background: #fff; border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      min-width: 180px; padding: 8px 0; margin-top: 4px;
    }
    .topnav .user-dropdown a {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; color: var(--text); text-decoration: none; font-size: 13px;
    }
    .topnav .user-dropdown a:hover { background: var(--bg); }
    .topnav .user-dropdown a.danger { color: var(--danger); }
    .user-menu-wrap { position: relative; }

    /* ===== Layout ===== */
    .app-layout { display: flex; flex: 1; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 240px;
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
      overflow-y: auto;
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
    }
    .sidebar .sidebar-section { margin-bottom: 24px; }
    .sidebar .sidebar-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted);
      padding: 0 16px 8px;
    }
    .sidebar .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; color: var(--text); text-decoration: none;
      font-size: 14px; border-radius: var(--radius);
      margin: 0 6px; cursor: pointer; transition: 0.15s;
      border: none; background: none; width: calc(100% - 12px); text-align: left;
    }
    .sidebar .sidebar-item:hover { background: var(--bg); }
    .sidebar .sidebar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .sidebar .sidebar-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar .sidebar-item .sb-txt { flex: 1; }

    /* ===== Main ===== */
    .main { flex: 1; padding: 24px 28px; overflow-y: auto; max-height: calc(100vh - 60px); }

    /* ===== Componentes ===== */
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

    .card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 20px;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 600; border: 1px solid transparent;
      cursor: pointer; transition: 0.15s; text-decoration: none; line-height: 1.4;
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-block { width: 100%; justify-content: center; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: var(--white); transition: 0.15s;
    }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,133,244,0.15); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    /* Badges base */
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .badge-amber { background: #fef3c7; color: #b45309; }
    .badge-gray { background: #f1f5f9; color: #4b5563; }
    .badge-teal { background: #ccfbf1; color: #0f766e; }

    /* Badges de estado (activo/inactivo) */
    .badge-estado-activo   { background: #dcfce7; color: #15803d; }
    .badge-estado-inactivo { background: #f1f5f9; color: #4b5563; }

    /* Etiquetas adicionales (Agenda virtual, Requiere laboratorio) */
    .badge-etiqueta {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .badge-etiqueta.azul   { background: #dbeafe; color: #1d4ed8; }
    .badge-etiqueta.ambar  { background: #fef3c7; color: #b45309; }

    /* Pills de categoría */
    .pill-categoria {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #1e2d3a;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      background: none;
    }
    .pill-categoria:hover { background: #f1f5f9; }
    .pill-categoria .contador {
      background: #f1f5f9;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 11px;
    }
    .pill-categoria.activa {
      background: #4285F4;
      border-color: #4285F4;
      color: #fff;
    }
    .pill-categoria.activa .contador { background: rgba(255,255,255,0.2); color: #fff; }

    /* Tabla */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; background: var(--bg); font-weight: 600; color: var(--text-muted); border-bottom: 2px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: #fafcff; }

    .tabs {
      display: flex; flex-wrap: wrap; gap: 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }
    .tab {
      padding: 10px 18px; font-size: 13px; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: 0.15s; background: none; border-top: none; border-left: none; border-right: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .flex { display: flex; align-items: center; gap: 8px; }
    .gap-4 { gap: 4px; }
    .mt-2 { margin-top: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .text-muted { color: var(--text-muted); }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .w-full { width: 100%; }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 12px 0; }
      .sidebar .sb-txt { display: none; }
      .sidebar .sidebar-item { justify-content: center; padding: 10px; }
      .sidebar .sidebar-label { text-align: center; font-size: 0; }
      .main { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .topnav .nav-links { display: none; }
      .topnav .nav-clinic { display: none; }
    }

    /* ===== Vistas (inicialmente ocultas) ===== */
    .view { display: none; }
    .view.active { display: block; }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff; border-radius: var(--radius);
      max-width: 700px; width: 100%; padding: 24px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal-box .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* Estilos para tratamientos en el modal */
    .trt-grupo { margin-bottom: 4px; }
    .trt-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; border-top: 1px solid var(--border); }
    .trt-item:hover { background: var(--bg); }
    .trt-item .os-split-label { display: none; font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .trt-item .os-pct-badge { display: none; font-size: 10px; font-weight: 700; color: #0891b2; white-space: nowrap; }

    /* Estilos para tarjetas de obras sociales */
    .os-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 768px) {
      .os-card-header { flex-direction: column !important; align-items: flex-start !important; gap: 10px !important; }
    }
  </style>
</head>

<script>
  // ============================================================

  // ============================================================
  const firebaseConfig = {

    authDomain: "clinicadental1.firebaseapp.com",

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ============================================================
  // UTILITIES
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function qs(sel, ctx=document) { return ctx.querySelector(sel); }
  function qsa(sel, ctx=document) { return ctx.querySelectorAll(sel); }
  function openModal(html) { const c=$('modal-generic-content'); c.innerHTML=html; $('modal-generic').classList.add('active'); }
  function closeModal() { $('modal-generic').classList.remove('active'); }
  function showToast(msg, type) { alert('🔔 '+msg); }
  function formatDate(d) { if (!d) return ''; return d.slice(0,10); }

  // ============================================================
  // NAVEGACIÓN SPA
  // ============================================================
  const views = ['dashboard','agenda','pacientes','profesionales','liquidaciones','automatizaciones',
                 'caja','presupuestos','productividad','obras_sociales','liquidaciones_os','inventario',
                 'proveedores','tratamientos','especialidades','web','whatsapp','configuracion'];
  let currentView = 'dashboard';

  function navigateTo(view) {
    if (!views.includes(view)) return;
    currentView = view;
    qsa('.sidebar .sidebar-item[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    qsa('.topnav .nav-links a[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    qsa('.view').forEach(el => el.classList.remove('active'));
    const target = $('view-'+view);
    if (target) target.classList.add('active');
    if (target && target.innerHTML.trim() === '') {
      loadView(view);
    }
  }

  document.querySelectorAll('.sidebar .sidebar-item[data-view]').forEach(btn => {
    btn.addEventListener('click', () => navigateTo(btn.dataset.view));
  });
  document.querySelectorAll('.topnav .nav-links a[data-view]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.preventDefault(); navigateTo(btn.dataset.view); });
  });

  function toggleUserMenu() {
    const dd = $('user-dropdown');
    dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.user-menu-wrap')) $('user-dropdown').style.display = 'none';
  });

  // ============================================================
  // CARGA DE VISTAS
  // ============================================================
  function loadView(view) {
    switch(view) {
      case 'dashboard': renderDashboard(); break;
      case 'agenda': renderAgenda(); break;
      case 'pacientes': renderPacientes(); break;
      case 'profesionales': renderProfesionales(); break;
      case 'liquidaciones': renderLiquidaciones(); break;
      case 'automatizaciones': renderAutomatizaciones(); break;
      case 'caja': renderCaja(); break;
      case 'presupuestos': renderPresupuestos(); break;
      case 'productividad': renderProductividad(); break;
      case 'obras_sociales': renderObrasSociales(); break;
      case 'liquidaciones_os': renderLiquidacionesOS(); break;
      case 'inventario': renderInventario(); break;
      case 'proveedores': renderProveedores(); break;
      case 'tratamientos': renderTratamientos(); break;
      case 'especialidades': renderEspecialidades(); break;
      case 'web': renderWeb(); break;
      case 'whatsapp': renderWhatsApp(); break;
      case 'configuracion': renderConfiguracion(); break;
    }
  }

  // ============================================================
  // DASHBOARD
  // ============================================================
  function renderDashboard() {
    const el = $('view-dashboard');
    el.innerHTML = `
      <div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-subtitle">Resumen de hoy</div></div></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
        <div class="card" style="border-left:3px solid var(--primary)"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Turnos hoy</div><div style="font-size:32px;font-weight:800;color:var(--primary)" id="dash-turnos-hoy">0</div></div>
        <div class="card" style="border-left:3px solid #22c55e"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Pacientes nuevos (mes)</div><div style="font-size:32px;font-weight:800;color:#22c55e" id="dash-pacientes-nuevos">0</div></div>
        <div class="card" style="border-left:3px solid #8b5cf6"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Ingresos del mes</div><div style="font-size:24px;font-weight:800;color:#8b5cf6" id="dash-ingresos">$0</div></div>
        <div class="card" style="border-left:3px solid #f59e0b"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Turnos pendientes</div><div style="font-size:32px;font-weight:800;color:#f59e0b" id="dash-turnos-pendientes">0</div></div>
      </div>
      <div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">Próximos turnos</div><div id="dash-proximos"></div></div>
    `;
    const hoy = new Date().toISOString().slice(0,10);
    db.collection('turnos').where('fecha','==',hoy).get().then(snap => { $('dash-turnos-hoy').textContent = snap.size; });
    const mesInicio = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
    db.collection('pacientes').where('fecha_creacion','>=',mesInicio).get().then(snap => { $('dash-pacientes-nuevos').textContent = snap.size; });
    db.collection('pagos').where('fecha','>=',mesInicio).get().then(snap => {
      let total=0; snap.forEach(d => total+=d.data().monto||0);
      $('dash-ingresos').textContent = '$'+total.toLocaleString();
    });
    db.collection('turnos').where('estado','==','pendiente').get().then(snap => { $('dash-turnos-pendientes').textContent = snap.size; });
    db.collection('turnos').limit(5).get().then(snap => {
      let html = '';
      snap.forEach(d => {
        const data = d.data();
        html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>${data.paciente||'Paciente'}</span><span>${data.fecha} ${data.hora}</span></div>`;
      });
      $('dash-proximos').innerHTML = html || '<div class="text-muted">No hay turnos próximos</div>';
    });
  }

  // ============================================================
  // AGENDA - NUEVA VERSIÓN COMPLETA (estilo DentalSoft)
  // ============================================================

  // Variables de estado
  let semanaActual = new Date();
  let filterOdontologo = 'todos';
  let filterSucursal = 'todos';
  let vistaActual = 'semana';
  const HORA_INICIO = 8;
  const PX_POR_HORA = 128;
  const SLOT_MINUTOS = 15;

  // Obtener el lunes de una fecha
  function obtenerLunes(fecha) {
    const d = new Date(fecha);
    const dia = d.getDay();
    const diff = dia === 0 ? -6 : 1 - dia;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Formatear fecha para mostrar
  function formatearFecha(yyyy_mm_dd) {
    const p = yyyy_mm_dd.split('-');
    const d = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
    const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return dias[d.getDay()] + ' ' + d.getDate() + ' ' + meses[d.getMonth()] + ' ' + p[0];
  }

  // Obtener el rango de fechas de la semana
  function getSemanaFechas(lunes) {
    const fechas = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(lunes);
      d.setDate(lunes.getDate() + i);
      fechas.push(d.toISOString().slice(0, 10));
    }
    return fechas;
  }

  // Calcular posición vertical de un turno
  function calcularPosicion(hora, duracion = 30) {
    const [h, m] = hora.split(':').map(Number);
    const minutosDesdeInicio = (h - HORA_INICIO) * 60 + m;
    const top = (minutosDesdeInicio / 60) * PX_POR_HORA;
    const height = (duracion / 60) * PX_POR_HORA;
    return { top, height };
  }

  // Calcular hora de fin
  function calcularHoraFin(horaInicio, duracion) {
    const [h, m] = horaInicio.split(':').map(Number);
    const totalMin = h * 60 + m + duracion;
    const hh = Math.floor(totalMin / 60);
    const mm = totalMin % 60;
    return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  // Snap a slot de tiempo
  function snapToSlot(y) {
    let totalMin = (y / PX_POR_HORA) * 60 + HORA_INICIO * 60;
    totalMin = Math.floor(totalMin / SLOT_MINUTOS) * SLOT_MINUTOS;
    totalMin = Math.max(HORA_INICIO * 60, Math.min(totalMin, (20 * 60) - SLOT_MINUTOS));
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const hora = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    const top = (totalMin / 60 - HORA_INICIO) * PX_POR_HORA;
    return { hora, top };
  }

  // Colores y etiquetas de estados
  const ESTADOS_COLORS = {
    'pendiente': '#6cd9f4',
    'confirmado': '#395ff3',
    'en_recepcion': '#f59e0b',
    'en_atencion': '#d853f3',
    'finalizado': '#16a34a',
    'cancelado': '#9ca3af',
    'ausente': '#dc2626'
  };
  const ESTADOS_LABELS = {
    'pendiente': 'Pendiente',
    'confirmado': 'Confirmado',
    'en_recepcion': 'En recepción',
    'en_atencion': 'En atención',
    'finalizado': 'Finalizado',
    'cancelado': 'Cancelado',
    'ausente': 'Ausente'
  };

  // ============================================================
  // RENDER AGENDA PRINCIPAL
  // ============================================================
  function renderAgenda() {
    const el = $('view-agenda');

    // Calcular semana actual
    const lunes = obtenerLunes(semanaActual);
    const fechas = getSemanaFechas(lunes);
    const hoy = new Date().toISOString().slice(0, 10);

    // Construir el HTML
    el.innerHTML = `
      <div class="page-header" style="margin-bottom:0;">
        <div>
          <div class="page-title">Agenda</div>
          <div class="page-subtitle">Semana del ${fechas[0].split('-').reverse().join('/')} al ${fechas[6].split('-').reverse().join('/')}</div>

          <!-- Filtros -->

            <select id="filtro-odontologo-agenda" class="form-control" style="width:180px;" onchange="aplicarFiltrosAgenda()">

              <option value="todos">Todas las sucursales</option>
            </select>

          <!-- Botón Bloquear -->
          <button onclick="openModalBloqueo()" class="btn btn-secondary btn-sm">🔒 Bloquear</button>
          <!-- Selector de vista -->
          <div style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;">
            <button class="btn btn-sm btn-secondary" style="border-radius:0;border:none;" onclick="cambiarVista('dia')">Día</button>
            <span class="btn btn-sm" style="border-radius:0;background:var(--primary);color:#fff;cursor:default;border:none;border-left:1px solid var(--border);">Semana</span>
            <button class="btn btn-sm btn-secondary" style="border-radius:0;border:none;border-left:1px solid var(--border);" onclick="cambiarVista('mes')">Mes</button>
            <button class="btn btn-sm btn-secondary" style="border-radius:0;border:none;border-left:1px solid var(--border);" onclick="cambiarVista('lista')">Lista</button>
          </div>
          <!-- Nuevo turno -->
          <a href="#" class="btn btn-primary btn-sm" onclick="openModalNuevoTurnoAgenda('${hoy}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo turno
          </a>
          <!-- Urgencia -->
          <a href="#" class="btn btn-sm" style="background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;" onclick="openModalNuevoTurnoAgenda('${hoy}', true)">⚡ Urgencia</a>
        </div>
      </div>

      <!-- Navegación semanal -->
      <div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:16px;flex-wrap:nowrap;height:79px;">
        <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(-1)">← Anterior</button>
        <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(0)">Hoy</button>
        <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(1)">Siguiente →</button>

        <!-- Panel de reprogramación (oculto inicialmente) -->
        <div id="reprog-panel" style="display:none;background:#fffbeb;border:2px solid #f59e0b;border-radius:10px;padding:10px 14px;align-items:center;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-size:10px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;">📅 Reprogramar turno</div>
            <div id="rp-paciente" style="font-size:13px;font-weight:700;color:#1e2d3a;"></div>
            <div id="rp-info" style="font-size:11px;color:#64748b;margin-top:1px;"></div>
          </div>
          <div style="font-size:11px;color:#92400e;background:rgba(245,158,11,.15);padding:5px 10px;border-radius:6px;white-space:nowrap;">
            Hacé click en la celda donde querés mover el turno
          </div>
          <button onclick="exitReprogramarMode()" class="btn btn-secondary btn-sm" style="white-space:nowrap;flex-shrink:0;">✕ Cancelar</button>
        </div>
      </div>

      <!-- Calendario -->
      <div id="cal-wrap" style="background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;">

        <!-- Headers de días -->
        <div id="cal-headers" style="display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:2px solid var(--border);">
          <div></div>
          ${fechas.map((f, idx) => {
            const diaNum = new Date(f + 'T00:00:00').getDate();
            const esHoy = f === hoy;
            const diaSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'][idx];
            return `
              <div data-col-idx="${idx}" style="padding:10px 8px;text-align:center;border-left:1px solid var(--border);${esHoy ? 'background:var(--accent-light,#e8f4f8);' : ''}">
                <div style="font-size:11px;color:var(--text-muted);font-weight:500;">${diaSemana}</div>
                <div style="font-size:20px;font-weight:800;${esHoy ? 'color:var(--primary);' : 'color:var(--text);'}line-height:1.2;">${diaNum}</div>
                <div class="turnos-count" style="font-size:10px;color:var(--text-muted);">0 turnos</div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Cuerpo del calendario -->
        <div id="cal-body" style="display:grid;grid-template-columns:52px repeat(7,1fr);overflow-y:auto;max-height:1556px;">

          <!-- Columna de horas -->
          <div style="position:relative;height:1536px;">
            ${Array.from({length:12}, (_, i) => HORA_INICIO + i).map(h => `
              <div style="position:absolute;top:${(h - HORA_INICIO) * PX_POR_HORA}px;right:6px;font-size:10px;color:var(--text-muted);line-height:1;">${String(h).padStart(2,'0')}:00</div>
            `).join('')}

          <!-- Columnas de días -->
          ${fechas.map((fecha, colIdx) => `
            <div class="cal-col"
                 data-fecha="${fecha}"

              <!-- Fondo alternado -->
              ${Array.from({length:24}, (_, i) => {
                const top = i * 64;
                if (i % 2 === 0) {
                  return `<div style="position:absolute;top:${top}px;left:0;right:0;height:64px;background:#f0f7ff;pointer-events:none;z-index:0;"></div>`;
                }
                return '';
              }).join('')}

              <!-- Líneas de hora -->
              ${Array.from({length:13}, (_, i) => {
                const top = i * PX_POR_HORA;
                return `<div style="position:absolute;top:${top}px;left:0;right:0;border-top:${i % 1 === 0 ? '1px solid #dde8f0' : '1px dashed #e8edf2'};pointer-events:none;z-index:1;"></div>`;
              }).join('')}

                   style="position:absolute;inset:0;z-index:2;cursor:pointer;"

              <!-- Contenedor de turnos (se llena con JS) -->
              <div class="turnos-container" style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>

            </div>
          `).join('')}

        </div>
      </div>

      <!-- Leyenda -->
      <div id="leyenda-agenda" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center;">

  // ============================================================
  // CARGAR TURNOS DESDE FIRESTORE
  // ============================================================
  function cargarTurnosSemana(fechas) {
    const fechaInicio = fechas[0];
    const fechaFin = fechas[6];

    db.collection('turnos')
      .where('fecha', '>=', fechaInicio)
      .where('fecha', '<=', fechaFin)
      .onSnapshot((snapshot) => {
        // Limpiar turnos existentes
        document.querySelectorAll('.turnos-container').forEach(container => {
          container.innerHTML = '';
        });

        // Resetear contadores
        document.querySelectorAll('.turnos-count').forEach(el => {
          el.textContent = '0 turnos';
        });

        // Agrupar turnos por fecha
        const turnosPorFecha = {};
        fechas.forEach(f => turnosPorFecha[f] = []);

        snapshot.forEach(doc => {
          const turno = doc.data();
          const fecha = turno.fecha;
          if (turnosPorFecha[fecha]) {
            turnosPorFecha[fecha].push({ id: doc.id, ...turno });
          }
        });

        // Renderizar turnos
        fechas.forEach(fecha => {
          const turnos = turnosPorFecha[fecha] || [];
          const container = document.querySelector(`.cal-col[data-fecha="${fecha}"] .turnos-container`);
          if (!container) return;

          // Actualizar contador
          const header = document.querySelector(`[data-col-idx="${fechas.indexOf(fecha)}"] .turnos-count`);
          if (header) header.textContent = `${turnos.length} ${turnos.length === 1 ? 'turno' : 'turnos'}`;

          // Ordenar turnos por hora
          turnos.sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));

          // Calcular columnas para solapamientos
          const slots = [];
          turnos.forEach(turno => {
            const { top, height } = calcularPosicion(turno.hora || '08:00', turno.duracion || 30);
            let col = 0;
            let ocupado = true;
            while (ocupado) {
              ocupado = slots.some(s => s.col === col && s.top < top + height && s.top + s.height > top);
              if (ocupado) col++;
            }
            slots.push({ col, top, height, turno });
          });

          // Renderizar cada turno
          slots.forEach(({ col, top, height, turno }) => {
            const esUrgencia = turno.es_urgencia || false;
            const color = esUrgencia ? '#dc2626' : (turno.color || '#355063');
            const estado = turno.estado || 'pendiente';
            const esCancelado = estado === 'cancelado' || estado === 'ausente';
            const opacity = esCancelado ? '0.45' : '1';

            const bloque = document.createElement('div');
            bloque.className = 'turno-block';
            bloque.draggable = true;
            bloque.dataset.id = turno.id;
            bloque.dataset.dur = turno.duracion || 30;
            bloque.dataset.fwFecha = turno.fecha;
            bloque.dataset.fwHora = turno.hora || '08:00';
            bloque.dataset.fwOdo = turno.odontologo_id || '0';
            bloque.dataset.origRightPct = col > 0 ? Math.round(100 / (col + 1)) : 0;

            const width = col === 0 ? 100 : Math.round(100 / (col + 1));
            const left = col > 0 ? Math.round((col / (col + 1)) * 100) : 0;

            bloque.style.cssText = `
              position:absolute;
              left:${left}%;
              right:${col > 0 ? (100 - left - width) : 0}%;
              top:${top}px;
              height:${height - 2}px;
              background:${color};
              border-radius:5px;
              padding:3px 5px;
              overflow:hidden;
              z-index:3;
              cursor:pointer;
              opacity:${opacity};
              pointer-events:auto;
              ${esUrgencia ? 'border:2px solid #991b1b;box-shadow:0 0 6px rgba(220,38,38,.4);' : ''}
              transition:right .18s ease;
            `;

            const horaMostrar = turno.hora || '--:--';
            const paciente = turno.paciente || 'Sin paciente';
            const estadoLabel = ESTADOS_LABELS[estado] || estado;
            const tratamiento = turno.tratamiento || '';

            bloque.innerHTML = `
              <div style="font-size:10px;font-weight:700;color:#fff;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;">
                ${esUrgencia ? '⚡ ' : ''}${horaMostrar} ${paciente}
              </div>
              <div style="display:flex;align-items:center;gap:4px;margin-top:1px;pointer-events:none;">
                <span style="font-size:9px;font-weight:700;color:#fff;background:${ESTADOS_COLORS[estado] || '#6cd9f4'};border-radius:3px;padding:1px 5px;white-space:nowrap;flex-shrink:0;">${estadoLabel}</span>
                ${tratamiento ? `<span style="font-size:9px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${tratamiento}</span>` : ''}
              </div>
              <div class="resize-handle" style="position:absolute;bottom:0;left:0;right:0;height:8px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;z-index:4;" title="Arrastrar para cambiar duración">
                <div style="width:20px;height:2px;background:rgba(255,255,255,.6);border-radius:2px;pointer-events:none;"></div>
              </div>
            `;

            bloque.dataset.popup = JSON.stringify({
              id: turno.id,
              paciente: paciente,
              paciente_nombre: paciente,
              telefono: turno.telefono || '',
              duracion: turno.duracion || 30,
              hora: `${horaMostrar} – ${calcularHoraFin(horaMostrar, turno.duracion || 30)}`,
              hora_inicio: horaMostrar,
              fecha: turno.fecha,
              trat: tratamiento,
              doc: turno.odontologo || 'Profesional',
              odontologo_nombre: turno.odontologo || 'Profesional',
              estado: estado,
              color: color,
              urgencia: esUrgencia,
              edit_url: '#',
              reprog_url: '#',
              del_url: '#',
              pago_url: '#',
              tratamientos: turno.tratamientos_realizados || [],
              total: turno.total_paciente || 0
            });

            bloque.addEventListener('click', function(e) {
              e.stopPropagation();
              mostrarPopupTurno(this);
            });

            bloque.addEventListener('dragstart', function(e) {
              e.dataTransfer.effectAllowed = 'move';
              this.style.opacity = '0.4';
            });
            bloque.addEventListener('dragend', function() {
              this.style.opacity = '';
            });

            container.appendChild(bloque);
          });

          // Agregar botón "+" para crear turno rápido (hover)
          // ... (se implementa con CSS y JS en el attachDragDropListeners)
        });

        attachDragDropListeners();

      }, (error) => {
        console.error('Error cargando turnos:', error);
      });
  }

  // ============================================================

  function mostrarPopupTurno(element) {
    const data = JSON.parse(element.dataset.popup);

  // ============================================================
  // DRAG & DROP LISTENERS
  // ============================================================
  function attachDragDropListeners() {
    // Configurar columnas para drag & drop
    document.querySelectorAll('.cal-col').forEach(col => {
      col.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const existing = col.querySelector('.drop-indicator');
        if (!existing) {
          const ind = document.createElement('div');
          ind.className = 'drop-indicator';
          ind.style.cssText = 'position:absolute;left:2px;right:2px;height:2px;background:var(--primary);z-index:20;pointer-events:none;border-radius:2px;';
          col.appendChild(ind);
        }
        const rect = col.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const snap = snapToSlot(y);
        col.querySelector('.drop-indicator').style.top = snap.top + 'px';
      });

      col.addEventListener('dragleave', function() {
        const ind = col.querySelector('.drop-indicator');
        if (ind) ind.remove();
      });

      col.addEventListener('drop', function(e) {
        e.preventDefault();
        const ind = col.querySelector('.drop-indicator');
        if (ind) ind.remove();

        const turnoId = e.dataTransfer.getData('text/plain');
        if (!turnoId) return;

        const fecha = this.dataset.fecha;
        const rect = this.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const snap = snapToSlot(y);

        if (confirm(`¿Mover turno a ${fecha} a las ${snap.hora}?`)) {
          moverTurno(turnoId, fecha, snap.hora);
        }
      });
    });

    // Configurar turnos para drag
    document.querySelectorAll('.turno-block').forEach(block => {
      block.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', this.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
    });
  }

    const sucursalId = $('f-turno-sucursal').value;

    if (!profesionalId) return alert('Selecciona un profesional.');

    db.collection('turnos').add(turnoData)
