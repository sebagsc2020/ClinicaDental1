<!DOCTYPE html><html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Clínica Dental · Panel Completo</title> <style> /* ===== Variables y reset ===== */ :root { --primary: #355063; --primary-dark: #1e2d3a; --accent: #4285F4; --accent-dark: #2b6ed7; --accent-light: #e8f0fe; --text: #1e2d3a; --text-muted: #64748b; --bg: #f1f5f9; --border: #e2e8f0; --white: #ffffff; --danger: #dc2626; --success: #16a34a; --warning: #f59e0b; --radius: 8px; --shadow: 0 2px 8px rgba(0,0,0,0.08); } * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
/* ===== Topnav ===== */
.topnav {
background: var(--primary);
color: #fff;
padding: 0 20px;
height: 60px;
display: flex;
align-items: center;
justify-content: space-between;
flex-shrink: 0;
position: sticky;
top: 0;
z-index: 100;
}
.topnav .logo { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.topnav .logo span { font-weight: 300; }
.topnav .nav-links { display: flex; gap: 8px; margin-left: 24px; }
.topnav .nav-links a {
color: rgba(255,255,255,0.7);
text-decoration: none;
font-size: 14px;
padding: 6px 12px;
border-radius: var(--radius);
transition: 0.2s;
}
.topnav .nav-links a:hover,
.topnav .nav-links a.active { background: rgba(255,255,255,0.15); color: #fff; }
.topnav .nav-right { display: flex; align-items: center; gap: 16px; }
.topnav .nav-clinic { font-size: 13px; opacity: 0.8; }
.topnav .nav-avatar {
width: 32px; height: 32px; border-radius: 50%;
background: var(--accent); display: flex; align-items: center; justify-content: center;
font-weight: 700; font-size: 13px; color: #fff;
}
.topnav .user-menu-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.topnav .nav-user-text { text-align: right; line-height: 1.2; }
.topnav .nav-user-text div:last-child { font-size: 11px; opacity: 0.6; }
.topnav .user-dropdown {
display: none; position: absolute; right: 0; top: 100%;
background: #fff; border-radius: var(--radius);
box-shadow: 0 8px 24px rgba(0,0,0,0.15);
min-width: 180px; padding: 8px 0; margin-top: 4px;
}
.topnav .user-dropdown a {
display: flex; align-items: center; gap: 8px;
padding: 8px 16px; color: var(--text); text-decoration: none; font-size: 13px;
}
.topnav .user-dropdown a:hover { background: var(--bg); }
.topnav .user-dropdown a.danger { color: var(--danger); }
.user-menu-wrap { position: relative; }

/* ===== Layout ===== */
.app-layout { display: flex; flex: 1; }

/* ===== Sidebar ===== */
.sidebar {
width: 240px;
background: var(--white);
border-right: 1px solid var(--border);
padding: 16px 0;
flex-shrink: 0;
overflow-y: auto;
height: calc(100vh - 60px);
position: sticky;
top: 60px;
}
.sidebar .sidebar-section { margin-bottom: 24px; }
.sidebar .sidebar-label {
font-size: 11px; font-weight: 700; text-transform: uppercase;
letter-spacing: 0.6px; color: var(--text-muted);
padding: 0 16px 8px;
}
.sidebar .sidebar-item {
display: flex; align-items: center; gap: 10px;
padding: 8px 16px; color: var(--text); text-decoration: none;
font-size: 14px; border-radius: var(--radius);
margin: 0 6px; cursor: pointer; transition: 0.15s;
border: none; background: none; width: calc(100% - 12px); text-align: left;
}
.sidebar .sidebar-item:hover { background: var(--bg); }
.sidebar .sidebar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.sidebar .sidebar-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar .sidebar-item .sb-txt { flex: 1; }

/* ===== Main ===== */
.main { flex: 1; padding: 24px 28px; overflow-y: auto; max-height: calc(100vh - 60px); }

/* ===== Componentes ===== */
.page-header {
display: flex; justify-content: space-between; align-items: center;
margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.page-title { font-size: 22px; font-weight: 700; }
.page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

.card {
background: var(--white); border: 1px solid var(--border);
border-radius: var(--radius); padding: 20px;
box-shadow: var(--shadow); margin-bottom: 20px;
}

.btn {
display: inline-flex; align-items: center; gap: 6px;
padding: 8px 16px; border-radius: var(--radius);
font-size: 13px; font-weight: 600; border: 1px solid transparent;
cursor: pointer; transition: 0.15s; text-decoration: none; line-height: 1.4;
}
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: #e2e8f0; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover { background: #b91c1c; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }

.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.form-control {
width: 100%; padding: 8px 12px;
border: 1px solid var(--border); border-radius: var(--radius);
font-size: 13px; background: var(--white); transition: 0.15s;
}
.form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,133,244,0.15); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

.badge {
display: inline-block; padding: 2px 10px; border-radius: 20px;
font-size: 12px; font-weight: 600;
}
.badge-green { background: #dcfce7; color: #15803d; }
.badge-blue { background: #dbeafe; color: #1d4ed8; }
.badge-red { background: #fee2e2; color: #b91c1c; }
.badge-amber { background: #fef3c7; color: #b45309; }
.badge-gray { background: #f1f5f9; color: #4b5563; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 12px; background: var(--bg); font-weight: 600; color: var(--text-muted); border-bottom: 2px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: #fafcff; }

.tabs {
display: flex; gap: 4px; border-bottom: 2px solid var(--border);
margin-bottom: 20px;
}
.tab {
padding: 10px 18px; font-size: 13px; font-weight: 600;
color: var(--text-muted); cursor: pointer;
border-bottom: 2px solid transparent; margin-bottom: -2px;
transition: 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.avatar {
width: 32px; height: 32px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.flex { display: flex; align-items: center; gap: 8px; }
.gap-4 { gap: 4px; }
.mt-2 { margin-top: 8px; }
.mb-2 { margin-bottom: 8px; }
.text-muted { color: var(--text-muted); }
.text-center { text-align: center; }
.text-right { text-align: right; }
.w-full { width: 100%; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
.sidebar { width: 60px; padding: 12px 0; }
.sidebar .sb-txt { display: none; }
.sidebar .sidebar-item { justify-content: center; padding: 10px; }
.sidebar .sidebar-label { text-align: center; font-size: 0; }
.main { padding: 16px; }
.form-grid { grid-template-columns: 1fr; }
.topnav .nav-links { display: none; }
.topnav .nav-clinic { display: none; }
}

/* ===== Vistas (inicialmente ocultas) ===== */
.view { display: none; }
.view.active { display: block; }

/* ===== Modal ===== */
.modal-overlay {
display: none; position: fixed; inset: 0;
background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
z-index: 9999; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-box {
background: #fff; border-radius: var(--radius);
max-width: 700px; width: 100%; padding: 24px;
max-height: 90vh; overflow-y: auto;
box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal-box .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Estilos para lista de tratamientos en el modal */
.trt-grupo { margin-bottom: 4px; }
.trt-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; border-top: 1px solid var(--border); transition: background 0.1s; }
.trt-item:hover { background: var(--bg); }
.trt-item .os-split-label { font-size: 11px; color: var(--text-muted); }
.trt-item .os-pct-badge { font-size: 10px; font-weight: 700; color: #0891b2; }
.trt-item input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--primary); flex-shrink: 0; }

/* Toggle de urgencia */
.urg-wrap { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 14px; transition: 0.2s; }
.urg-wrap.active { background: #fef2f2; border-color: #fca5a5; }
.urg-wrap.active .urg-title { color: #b91c1c; }
.urg-wrap.active .urg-desc { color: #b91c1c; }

/* Coseguro */
.coseguro-wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); margin-top: 8px; }
.coseguro-wrap input { width: 90px; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 13px; text-align: right; }

/* Subtotal tratamientos */
#trt-subtotal { display: none; margin-top: 8px; padding: 8px 12px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }
#trt-subtotal .total-row { display: flex; justify-content: space-between; align-items: center; }
#trt-subtotal .total-row .label { font-size: 12px; color: var(--text-muted); }
#trt-subtotal .total-row .value { font-size: 14px; font-weight: 700; color: var(--primary); }
#os-totales { display: none; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
#coseguro-row { display: none; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); }
</style>

tive')); const target = $('view-'+view); if (target) target.classList.add('active'); if (target && target.innerHTML.trim() === '') { loadView(view); } } document.querySelectorAll('.sidebar .sidebar-item[data-view]').forEach(btn => { btn.addEventListener('click', () => navigateTo(btn.dataset.view)); }); document.querySelectorAll('.topnav .nav-links a[data-view]').forEach(btn => { btn.addEventListener('click', (e) => { e.preventDefault(); navigateTo(btn.dataset.view); }); }); function toggleUserMenu() { const dd = $('user-dropdown'); dd.style.display = dd.style.display === 'block' ? 'none' : 'block'; } document.addEventListener('click', (e) => { if (!e.target.closest('.user-menu-wrap')) $('user-dropdown').style.display = 'none'; }); // ============================================================ // CARGA DE VISTAS (solo las que se usan en este demo) // ============================================================ function loadView(view) { switch(view) { case 'dashboard': renderDashboard(); break; case 'agenda': renderAgenda(); break; // Otras vistas se mantienen vacías o con mensaje default: const el = $('view-'+view); if (el) el.innerHTML = `<div class="page-header"><div><div class="page-title">${views.find(v=>v===view)}</div><div class="page-subtitle">Contenido en desarrollo</div></div></div><div class="card"><p class="text-muted">Esta sección se cargará desde Firestore próximamente.</p></div>`; } } // ============================================================ // DASHBOARD (simplificado) // ============================================================ function renderDashboard() { const el = $('view-dashboard'); el.innerHTML = ` <div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-subtitle">Resumen de hoy</div></div></div> <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px"> <div class="card" style="border-left:3px solid var(--primary)"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Turnos hoy</div><div style="font-size:32px;font-weight:800;color:var(--primary)" id="dash-turnos-hoy">0</div></div> <div class="card" style="border-left:3px solid #22c55e"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Pacientes nuevos (mes)</div><div style="font-size:32px;font-weight:800;color:#22c55e" id="dash-pacientes-nuevos">0</div></div> <div class="card" style="border-left:3px solid #8b5cf6"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Ingresos del mes</div><div style="font-size:24px;font-weight:800;color:#8b5cf6" id="dash-ingresos">$0</div></div> <div class="card" style="border-left:3px solid #f59e0b"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Turnos pendientes</div><div style="font-size:32px;font-weight:800;color:#f59e0b" id="dash-turnos-pendientes">0</div></div> </div> <div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">Próximos turnos</div><div id="dash-proximos"></div></div> `; const hoy = new Date().toISOString().slice(0,10); db.collection('turnos').where('fecha','==',hoy).get().then(snap => { $('dash-turnos-hoy').textContent = snap.size; }); const mesInicio = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10); db.collection('pacientes').where('fecha_creacion','>=',mesInicio).get().then(snap => { $('dash-pacientes-nuevos').textContent = snap.size; }); db.collection('pagos').where('fecha','>=',mesInicio).get().then(snap => { let total=0; snap.forEach(d => total+=d.data().monto||0); $('dash-ingresos').textContent = '$'+total.toLocaleString(); }); db.collection('turnos').where('estado','==','pendiente').get().then(snap => { $('dash-turnos-pendientes').textContent = snap.size; }); db.collection('turnos').limit(5).get().then(snap => { let html = ''; snap.forEach(d => { const data = d.data(); html += `<div style="display:f rySelector(`.day-turnos[data-fecha="${fecha}"]`); if (!columna) return; const bloque = document.createElement('div'); bloque.style.cssText = ` position:absolute; top:${top}px; left:2px; right:2px; height:${height-2}px; background:${turno.color || '#355063'}; border-radius:5px; padding:2px 4px; overflow:hidden; z-index:3; cursor:pointer; font-size:10px; color:#fff; font-weight:600; white-space:nowrap; text-overflow:ellipsis; `; bloque.textContent = `${hora} ${turno.paciente || 'Sin paciente'}`; bloque.title = `${turno.paciente} - ${turno.tratamiento || ''}`; bloque.onclick = () => alert(`Turno de ${turno.paciente}\n${turno.fecha} ${turno.hora}\nEstado: ${turno.estado || 'Pendiente'}`); columna.appendChild(bloque); }); document.querySelectorAll('.day-turnos').forEach((col, idx) => { const count = col.children.length; const headerDiv = document.querySelectorAll(`[style*="text-align:center;"]`)[idx+1]; if (headerDiv) { let existing = headerDiv.querySelector('.turnos-count'); if (!existing) { existing = document.createElement('div'); existing.className = 'turnos-count'; existing.style.cssText = 'font-size:10px;color:var(--text-muted);margin-top:2px;'; headerDiv.appendChild(existing); } existing.textContent = count + ' turnos'; } }); }, (error) => { console.error('Error cargando turnos:', error); }); } function cambiarSemana(direccion) { if (direccion === 0) { semanaActual = obtenerLunes(new Date()); } else { semanaActual.setDate(semanaActual.getDate() + direccion * 7); } renderAgenda(); } // ============================================================ // NUEVO TURNO - MODAL COMPLETO // ============================================================ // Datos de cobertura simulados (los cargarás desde Firestore en producción) // estructura: { tratamiento_id: { plan_id: porcentaje } } const COBERTURAS = { 9: { 2: 50, 1: 30, 3: 20, 4: 50 }, 2: { 1: 40, 2: 60 }, 1: { 1: 30, 2: 40 }, 10: { 1: 50, 2: 60 }, 44: { 1: 20, 2: 30 }, 48: { 1: 25, 2: 35 }, 46: { 1: 20, 2: 30 }, 42: { 1: ng:4px;"> <p class="text-muted" style="padding:12px;text-align:center;">Cargando tratamientos...</p> </div> <input type="hidden" id="inp-total-paciente" value=""> <input type="hidden" id="inp-total-obra-social" value=""> <div id="trt-subtotal"> <div class="total-row"> <span class="label"><span id="trt-count">0</span> tratamiento(s)</span> <span class="value">$<span id="trt-total-val">0</span></span> </div> <div id="os-totales"> <div style="display:flex;justify-content:space-between;font-size:12px;"> <span style="color:var(--text-muted);">Tratamientos paciente:</span> <span style="font-weight:700;color:#15803d;">$<span id="trt-paciente-val">0</span></span> </div> <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:2px;"> <span style="color:var(--text-muted);">Cubre obra social:</span> <span style="font-weight:700;color:#0891b2;">$<span id="trt-os-val">0</span></span> </div> </div> <div id="coseguro-row"> <div style="display:flex;justify-content:space-between;font-size:12px;"> <span style="color:var(--text-muted);">Coseguro:</span> <span style="font-weight:700;color:#f59e0b;">$<span id="trt-coseguro-val">0</span></span> </div> <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:2px;padding-top:4px;border-top:1px solid var(--border);"> <span style="font-weight:600;color:var(--text);">Paciente paga total:</span> <span style="font-weight:700;color:#15803d;">$<span id="trt-paciente-total-val">0</span></span> </div> </div> </div> <!-- Coseguro --> <div class="coseguro-wrap"> <div> <div style="font-size:12px;font-weight:600;color:var(--text);">Coseguro</div> <div style="font-size:11px;color:var(--text-muted);">Pago adicional del paciente (opcional)</div> </div> <div style="display:flex;align-items:center;gap:4px;"> <span style="font-size:13px;color:var(--text-muted);font-weight:600;">$</span> <input type="number" id="coseguro-input" min="0" step="0.01" value="" oninput="recalcPrecio()" placeholder="0.00"> </div> </div> <button type="button" id="btn-pago-caja" class="btn btn-block" disabled style="margin-top:12px;background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;opacity:.45;cursor:not-allowed;"> 💰 Guardar y Registrar pago en Caja </button> </div> </form> <div class="modal-actions" style="margin-top:16px;"> <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button> <button class="btn btn-primary" onclick="guardarTurnoCompleto()">Crear turno</button> </div> `;
openModal(modalHTML);

// Cargar tratamientos
function cargarTratamientosTurno() {
const container = document.getElementById('trt-lista');
if (!container) return;

db.collection('tratamientos').orderBy('categoria').orderBy('nombre').get().then(snap => {
if (snap.empty) {
container.innerHTML = '<p class="text-muted" style="padding:12px;text-align:center;">No hay tratamientos cargados</p>';
return;
}

let grupos = {};
snap.forEach(doc => {
const data = doc.data();
const cat = data.categoria || 'otros';
if (!grupos[cat]) grupos[cat] = [];
grupos[cat].push({ id: doc.id, ...data });
});

let html = '';
for (const [cat, items] of Object.entries(grupos)) {
html += `<div class="trt-grupo" data-cat="${cat}">

<div style="padding:4px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);background:var(--bg);position:sticky;top:0;">${cat}</div>`; items.forEach(trat => { html += ` <label class="trt-item" data-nombre="${(trat.nombre || '').toLowerCase()}"> <input type="checkbox" name="tratamientos_realizados_ids[]" value="${trat.id}" data-precio="${trat.precio_base || 0}" data-trat-id="${trat.id}" onchange="recalcPrecio()"> <div style="flex:1;min-width:0;"> <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${trat.nombre || 'Sin nombre'}</div> <div class="os-split-label" style="display:none;font-size:11px;color:var(--text-muted);margin-top:1px;"></div> </div> <div style="text-align:right;flex-shrink:0;"> <div style="font-size:12px;font-weight:600;color:var(--primary);white-space:nowrap;">$${Number(trat.precio_base || 0).toLocaleString()}</div> <div class="os-pct-badge" style="display:none;font-size:10px;font-weight:700;color:#0891b2;white-space:nowrap;"></div> </div> </label> `; }); html += `</div>`; } container.innerHTML = html; // Trigger recálculo de cobertura si ya hay paciente seleccionado onPacienteChangeTurno(); }); }
// Cambio de paciente
window.onPacienteChangeTurno = function() {
const sel = document.getElementById('f-turno-paciente');
if (!sel) return;
const pid = sel.value;
const osData = pid ? PACIENTES_OS[pid] : null;
currentPlanId = osData ? (osData.plan_id || 0) : 0;

const banner = document.getElementById('os-banner');
if (banner) {
if (osData && currentPlanId) {
const opt = sel.options[sel.selectedIndex];
banner.style.display = 'block';
document.getElementById('os-banner-nombre').textContent = opt ? opt.textContent.trim().split('—')[0].trim() : '';
} else {
banner.style.display = 'none';
}
}

// Actualizar badges de cobertura
document.querySelectorAll('#trt-lista .trt-item input[type="checkbox"]').forEach(cb => {
const tid = parseInt(cb.dataset.tratId);
const precio = parseFloat(cb.dataset.precio) || 0;
const label = cb.closest('label');
const splitEl = label ? label.querySelector('.os-split-label') : null;
const badgeEl = label ? label.querySelector('.os-pct-badge') : null;

const pct = (currentPlanId && COBERTURAS[tid] && COBERTURAS[tid][currentPlanId])
? parseFloat(COBERTURAS[tid][currentPlanId]) : 0;

if (splitEl) {
if (pct > 0 && precio > 0) {
const montoOS = precio * pct / 100;
const montoPac = precio - montoOS;
splitEl.textContent = Pte: $${montoPac.toFixed(0)} · OS ${pct}%: $${montoOS.toFixed(0)};
splitEl.style.display = 'block';
} else {
splitEl.style.display = 'none';
}
}
if (badgeEl) {
if (pct > 0) {
badgeEl.textContent = 'OS ' + pct + '%';
badgeEl.style.display = 'block';
} else {
badgeEl.style.display = 'none';
}
}
});

recalcPrecio();
};

// Recalcular totales
function recalcPrecio() {
const checks = document.querySelectorAll('#trt-lista .trt-item input[type="checkbox"]:checked');
let total = 0, totalPac = 0, totalOS = 0, count = 0;
checks.forEach(cb => {
const precio = parseFloat(cb.dataset.precio) || 0;
const tid = parseInt(cb.dataset.tratId);
const pct = (currentPlanId && COBERTURAS[tid] && COBERTURAS[tid][currentPlanId])
? parseFloat(COBERTURAS[tid][currentPlanId]) : 0;
const montoOS = precio * pct / 100;
total += precio;
totalOS += montoOS;
totalPac += precio - montoOS;
count++;
});

const coseguroInp = document.getElementById('coseguro-input');
const coseguro = coseguroInp ? (parseFloat(coseguroInp.value) || 0) : 0;

const subtDiv = document.getElementById('trt-subtotal');
const countEl = document.getElementById('trt-count');
const totalEl = document.getElementById('trt-total-val');
const pacEl = document.getElementById('trt-paciente-val');
const osEl = document.getElementById('trt-os-val');
const osTotDiv = document.getElementById('os-totales');
const coseguroRow = document.getElementById('coseguro-row');
const coseguroEl = document.getElementById('trt-coseguro-val');
const pacTotalEl = document.getElementById('trt-paciente-total-val');
const btnCaja = document.getElementById('btn-pago-caja');
const inpPac = document.getElementById('inp-total-paciente');
const inpOS = document.getElementById('inp-total-obra-social');

const hasContent = count > 0 || coseguro > 0;

if (hasContent) {
if (countEl) countEl.textContent = count;
if (totalEl) totalEl.textContent = total.toFixed(0);
subtDiv.style.display = 'block';

if (currentPlanId && totalOS > 0) {
if (pacEl) pacEl.textContent = totalPac.toFixed(0);
if (osEl) osEl.textContent = totalOS.toFixed(0);
if (osTotDiv) osTotDiv.style.display = 'block';
} else {
if (osTotDiv) osTotDiv.style.display = 'none';
}

if (coseguro > 0) {
if (coseguroEl) coseguroEl.textContent = coseguro.toFixed(0);
if (pacTotalEl) pacTotalEl.textContent = (totalPac + coseguro).toFixed(0);
if (coseguroRow) coseguroRow.style.display = 'block';
} else {
if (coseguroRow) coseguroRow.style.display = 'none';
}

if (inpPac) inpPac.value = totalPac.toFixed(2);
if (inpOS) inpOS.value = totalOS.toFixed(2);

if (btnCaja) { btnCaja.disabled = false; btnCaja.style.opacity = '1'; btnCaja.style.cursor = ''; }
} else {
subtDiv.style.display = 'none';
if (coseguroRow) coseguroRow.style.display = 'none';
if (inpPac) inpPac.value = '';
if (inpOS) inpOS.value = '';
if (btnCaja) { btnCaja.disabled = true; btnCaja.style.opacity = '.45'; btnCaja.style.cursor = 'not-allowed'; }
}
}

// Filtrar tratamientos
function filtrarTratsTurno(q) {
q = q.toLowerCase().trim();
document.querySelectorAll('#trt-lista .trt-item').forEach(item => {
item.style.display = (!q || (item.dataset.nombre || '').indexOf(q) !== -1) ? '' : 'none';
});
document.querySelectorAll('#trt-lista .trt-grupo').forEach(grupo => {
const vis = Array.from(grupo.querySelectorAll('.trt-item')).filter(i => i.style.display !== 'none');
grupo.style.display = vis.length > 0 ? '' : 'none';
});
}

// Duración
function durSelectChangeTurno(val) {
if (val === 'custom') return;
document.getElementById('dur-input').value = val;
}
function durInputChangeTurno(val) {
const sel = document.getElementById('dur-select');
sel.value = DUR_PRESETS.indexOf(parseInt(val)) !== -1 ? val : 'custom';
}

// Urgencia
function toggleUrgenciaTurno(cb) {
const wrap = document.getElementById('urg-wrap');
if (cb.checked) {
wrap.classList.add('active');
} else {
wrap.classList.remove('active');
}
}

// Guardar turno completo
window.guardarTurnoCompleto = function() {
const pacienteId = document.getElementById('f-turno-paciente').value;
const profesionalId = document.getElementById('f-turno-profesional').value;
const sucursalId = document.getElementById('f-turno-sucursal').value;
const fecha = document.getElementById('f-turno-fecha').value;
const hora = document.getElementById('f-turno-hora').value;
const duracion = parseInt(document.getElementById('dur-input').value) || 30;
const estado = document.getElementById('f-turno-estado').value;
const esUrgencia = document.getElementById('f-turno-urgencia').checked;
const motivo = document.getElementById('f-turno-motivo').value.trim();

const tratamientosSeleccionados = [];
document.querySelectorAll('#trt-lista .trt-item input[type="checkbox"]:checked').forEach(cb => {
tratamientosSeleccionados.push({
id: cb.value,
precio: parseFloat(cb.dataset.precio) || 0
});
});

const coseguro = parseFloat(document.getElementById('coseguro-input').value) || 0;
const totalPaciente = parseFloat(document.getElementById('inp-total-paciente').value) || 0;
const totalOS = parseFloat(document.getElementById('inp-total-obra-social').value) || 0;

if (!pacienteId) return alert('Selecciona un paciente.');
if (!profesionalId) return alert('Selecciona un profesional.');
if (!sucursalId) return alert('Selecciona una sucursal.');
if (!fecha || !hora) return alert('Completa fecha y hora.');

const pacienteNombre = document.getElementById('f-turno-paciente').options[document.getElementById('f-turno-paciente').selectedIndex].text;
const profesionalNombre = document.getElementById('f-turno-profesional').options[document.getElementById('f-turno-profesional').selectedIndex].text;

const turnoData = {
paciente_id: pacienteId,
paciente: pacienteNombre,
odontologo_id: profesionalId,
odontologo: profesionalNombre,
sucursal_id: sucursalId,
fecha: fecha,
hora: hora,
duracion: duracion,
estado: estado,
es_urgencia: esUrgencia,
motivo_consulta: motivo,
tratamientos_realizados: tratamientosSeleccionados,
coseguro: coseguro,
total_paciente: totalPaciente,
total_obra_social: totalOS,
color: esUrgencia ? '#dc2626' : '#355063',
creado: new Date().toISOString()
};

db.collection('turnos').add(turnoData)
.then(() => {
closeModal();
showToast('✅ Turno creado exitosamente.');
renderAgenda();
})
.catch(err => {
alert('❌ Error al crear el turno: ' + err.message);
});
};

// ============================================================
// INICIALIZACIÓN
// ============================================================
navigateTo('dashboard');
$('modal-generic').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

console.log('Panel DentalSoft con nuevo turno completo iniciado.');
</script>
