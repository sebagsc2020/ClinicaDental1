<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Dental · Panel Completo</title>

  <style>
    /* ===== Variables y reset ===== */
    :root {
      --primary: #355063;
      --primary-dark: #1e2d3a;
      --accent: #4285F4;
      --accent-dark: #2b6ed7;
      --accent-light: #e8f0fe;
      --text: #1e2d3a;
      --text-muted: #64748b;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --white: #ffffff;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #f59e0b;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== Topnav ===== */
    .topnav {
      background: var(--primary);
      color: #fff;
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topnav .logo { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .topnav .logo span { font-weight: 300; }
    .topnav .nav-links { display: flex; gap: 8px; margin-left: 24px; }
    .topnav .nav-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: var(--radius);
      transition: 0.2s;
    }
    .topnav .nav-links a:hover,
    .topnav .nav-links a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .topnav .nav-right { display: flex; align-items: center; gap: 16px; }
    .topnav .nav-clinic { font-size: 13px; opacity: 0.8; }
    .topnav .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff;
    }
    .topnav .user-menu-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .topnav .nav-user-text { text-align: right; line-height: 1.2; }
    .topnav .nav-user-text div:last-child { font-size: 11px; opacity: 0.6; }
    .topnav .user-dropdown {
      display: none; position: absolute; right: 0; top: 100%;
      background: #fff; border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      min-width: 180px; padding: 8px 0; margin-top: 4px;
    }
    .topnav .user-dropdown a {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; color: var(--text); text-decoration: none; font-size: 13px;
    }
    .topnav .user-dropdown a:hover { background: var(--bg); }
    .topnav .user-dropdown a.danger { color: var(--danger); }
    .user-menu-wrap { position: relative; }

    /* ===== Layout ===== */
    .app-layout { display: flex; flex: 1; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 240px;
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
      overflow-y: auto;
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
    }
    .sidebar .sidebar-section { margin-bottom: 24px; }
    .sidebar .sidebar-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted);
      padding: 0 16px 8px;
    }
    .sidebar .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; color: var(--text); text-decoration: none;
      font-size: 14px; border-radius: var(--radius);
      margin: 0 6px; cursor: pointer; transition: 0.15s;
      border: none; background: none; width: calc(100% - 12px); text-align: left;
    }
    .sidebar .sidebar-item:hover { background: var(--bg); }
    .sidebar .sidebar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .sidebar .sidebar-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar .sidebar-item .sb-txt { flex: 1; }

    /* ===== Main ===== */
    .main { flex: 1; padding: 24px 28px; overflow-y: auto; max-height: calc(100vh - 60px); }

    /* ===== Componentes ===== */
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

    .card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 20px;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 600; border: 1px solid transparent;
      cursor: pointer; transition: 0.15s; text-decoration: none; line-height: 1.4;
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-block { width: 100%; justify-content: center; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: var(--white); transition: 0.15s;
    }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,133,244,0.15); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    /* Badges base */
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .badge-amber { background: #fef3c7; color: #b45309; }
    .badge-gray { background: #f1f5f9; color: #4b5563; }
    .badge-teal { background: #ccfbf1; color: #0f766e; }

    /* Badges de estado (activo/inactivo) */
    .badge-estado-activo   { background: #dcfce7; color: #15803d; }
    .badge-estado-inactivo { background: #f1f5f9; color: #4b5563; }

    /* Etiquetas adicionales (Agenda virtual, Requiere laboratorio) */
    .badge-etiqueta {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .badge-etiqueta.azul   { background: #dbeafe; color: #1d4ed8; }
    .badge-etiqueta.ambar  { background: #fef3c7; color: #b45309; }

    /* Pills de categoría */
    .pill-categoria {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      color: #1e2d3a;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      background: none;
    }
    .pill-categoria:hover { background: #f1f5f9; }
    .pill-categoria .contador {
      background: #f1f5f9;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 11px;
    }
    .pill-categoria.activa {
      background: #4285F4;
      border-color: #4285F4;
      color: #fff;
    }
    .pill-categoria.activa .contador { background: rgba(255,255,255,0.2); color: #fff; }

    /* Tabla */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; background: var(--bg); font-weight: 600; color: var(--text-muted); border-bottom: 2px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: #fafcff; }

    .tabs {
      display: flex; flex-wrap: wrap; gap: 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }
    .tab {
      padding: 10px 18px; font-size: 13px; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: 0.15s; background: none; border-top: none; border-left: none; border-right: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .flex { display: flex; align-items: center; gap: 8px; }
    .gap-4 { gap: 4px; }
    .mt-2 { margin-top: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .text-muted { color: var(--text-muted); }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .w-full { width: 100%; }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 12px 0; }
      .sidebar .sb-txt { display: none; }
      .sidebar .sidebar-item { justify-content: center; padding: 10px; }
      .sidebar .sidebar-label { text-align: center; font-size: 0; }
      .main { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .topnav .nav-links { display: none; }
      .topnav .nav-clinic { display: none; }
    }

    /* ===== Vistas (inicialmente ocultas) ===== */
    .view { display: none; }
    .view.active { display: block; }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff; border-radius: var(--radius);
      max-width: 700px; width: 100%; padding: 24px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal-box .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* Estilos para tratamientos en el modal */
    .trt-grupo { margin-bottom: 4px; }
    .trt-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; border-top: 1px solid var(--border); }
    .trt-item:hover { background: var(--bg); }
    .trt-item .os-split-label { display: none; font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .trt-item .os-pct-badge { display: none; font-size: 10px; font-weight: 700; color: #0891b2; white-space: nowrap; }

    /* Estilos para tarjetas de obras sociales */
    .os-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 768px) {
      .os-card-header { flex-direction: column !important; align-items: flex-start !important; gap: 10px !important; }
    }
  </style>
</head>

<script>
  // ============================================================

  // ============================================================
  const firebaseConfig = {

    authDomain: "clinicadental1.firebaseapp.com",

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ============================================================
  // UTILITIES
  // ============================================================
  function $(id) { return document.getElementById(id); }
  function qs(sel, ctx=document) { return ctx.querySelector(sel); }
  function qsa(sel, ctx=document) { return ctx.querySelectorAll(sel); }
  function openModal(html) { const c=$('modal-generic-content'); c.innerHTML=html; $('modal-generic').classList.add('active'); }
  function closeModal() { $('modal-generic').classList.remove('active'); }
  function showToast(msg, type) { alert('🔔 '+msg); }
  function formatDate(d) { if (!d) return ''; return d.slice(0,10); }

  // ============================================================
  // NAVEGACIÓN SPA
  // ============================================================
  const views = ['dashboard','agenda','pacientes','profesionales','liquidaciones','automatizaciones',
                 'caja','presupuestos','productividad','obras_sociales','liquidaciones_os','inventario',
                 'proveedores','tratamientos','especialidades','web','whatsapp','configuracion'];
  let currentView = 'dashboard';

  function navigateTo(view) {
    if (!views.includes(view)) return;
    currentView = view;
    qsa('.sidebar .sidebar-item[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    qsa('.topnav .nav-links a[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    qsa('.view').forEach(el => el.classList.remove('active'));
    const target = $('view-'+view);
    if (target) target.classList.add('active');
    if (target && target.innerHTML.trim() === '') {
      loadView(view);
    }
  }

  document.querySelectorAll('.sidebar .sidebar-item[data-view]').forEach(btn => {
    btn.addEventListener('click', () => navigateTo(btn.dataset.view));
  });
  document.querySelectorAll('.topnav .nav-links a[data-view]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.preventDefault(); navigateTo(btn.dataset.view); });
  });

  function toggleUserMenu() {
    const dd = $('user-dropdown');
    dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.user-menu-wrap')) $('user-dropdown').style.display = 'none';
  });

  // ============================================================
  // CARGA DE VISTAS
  // ============================================================
  function loadView(view) {
    switch(view) {
      case 'dashboard': renderDashboard(); break;
      case 'agenda': renderAgenda(); break;
      case 'pacientes': renderPacientes(); break;
      case 'profesionales': renderProfesionales(); break;
      case 'liquidaciones': renderLiquidaciones(); break;
      case 'automatizaciones': renderAutomatizaciones(); break;
      case 'caja': renderCaja(); break;
      case 'presupuestos': renderPresupuestos(); break;
      case 'productividad': renderProductividad(); break;
      case 'obras_sociales': renderObrasSociales(); break;
      case 'liquidaciones_os': renderLiquidacionesOS(); break;
      case 'inventario': renderInventario(); break;
      case 'proveedores': renderProveedores(); break;
      case 'tratamientos': renderTratamientos(); break;
      case 'especialidades': renderEspecialidades(); break;
      case 'web': renderWeb(); break;
      case 'whatsapp': renderWhatsApp(); break;
      case 'configuracion': renderConfiguracion(); break;
    }
  }

  // ============================================================
  // DASHBOARD
  // ============================================================
  function renderDashboard() {
    const el = $('view-dashboard');
    el.innerHTML = `
      <div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-subtitle">Resumen de hoy</div></div></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
        <div class="card" style="border-left:3px solid var(--primary)"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Turnos hoy</div><div style="font-size:32px;font-weight:800;color:var(--primary)" id="dash-turnos-hoy">0</div></div>
        <div class="card" style="border-left:3px solid #22c55e"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Pacientes nuevos (mes)</div><div style="font-size:32px;font-weight:800;color:#22c55e" id="dash-pacientes-nuevos">0</div></div>
        <div class="card" style="border-left:3px solid #8b5cf6"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Ingresos del mes</div><div style="font-size:24px;font-weight:800;color:#8b5cf6" id="dash-ingresos">$0</div></div>
        <div class="card" style="border-left:3px solid #f59e0b"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase">Turnos pendientes</div><div style="font-size:32px;font-weight:800;color:#f59e0b" id="dash-turnos-pendientes">0</div></div>
      </div>
      <div class="card"><div style="font-size:14px;font-weight:700;margin-bottom:12px">Próximos turnos</div><div id="dash-proximos"></div></div>
    `;
    const hoy = new Date().toISOString().slice(0,10);
    db.collection('turnos').where('fecha','==',hoy).get().then(snap => { $('dash-turnos-hoy').textContent = snap.size; });
    const mesInicio = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
    db.collection('pacientes').where('fecha_creacion','>=',mesInicio).get().then(snap => { $('dash-pacientes-nuevos').textContent = snap.size; });
    db.collection('pagos').where('fecha','>=',mesInicio).get().then(snap => {
      let total=0; snap.forEach(d => total+=d.data().monto||0);
      $('dash-ingresos').textContent = '$'+total.toLocaleString();
    });
    db.collection('turnos').where('estado','==','pendiente').get().then(snap => { $('dash-turnos-pendientes').textContent = snap.size; });
    db.collection('turnos').limit(5).get().then(snap => {
      let html = '';
      snap.forEach(d => {
        const data = d.data();
        html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>${data.paciente||'Paciente'}</span><span>${data.fecha} ${data.hora}</span></div>`;
      });
      $('dash-proximos').innerHTML = html || '<div class="text-muted">No hay turnos próximos</div>';
    });
  }

  // ============================================================
  // AGENDA - NUEVA VERSIÓN COMPLETA (estilo DentalSoft)
  // ============================================================

  // Variables de estado
  let semanaActual = new Date();
  let filterOdontologo = 'todos';
  let filterSucursal = 'todos';
  let vistaActual = 'semana';
  const HORA_INICIO = 8;
  const PX_POR_HORA = 128;
  const SLOT_MINUTOS = 15;

  // Obtener el lunes de una fecha
  function obtenerLunes(fecha) {
    const d = new Date(fecha);
    const dia = d.getDay();
    const diff = dia === 0 ? -6 : 1 - dia;
    d.setDate(d.getDate() + diff);
    return d;
  }

  // Formatear fecha para mostrar
  function formatearFecha(yyyy_mm_dd) {
    const p = yyyy_mm_dd.split('-');
    const d = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
    const dias = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return dias[d.getDay()] + ' ' + d.getDate() + ' ' + meses[d.getMonth()] + ' ' + p[0];
  }

  // Obtener el rango de fechas de la semana
  function getSemanaFechas(lunes) {
    const fechas = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(lunes);
      d.setDate(lunes.getDate() + i);
      fechas.push(d.toISOString().slice(0, 10));
    }
    return fechas;
  }

  // Calcular posición vertical de un turno
  function calcularPosicion(hora, duracion = 30) {
    const [h, m] = hora.split(':').map(Number);
    const minutosDesdeInicio = (h - HORA_INICIO) * 60 + m;
    const top = (minutosDesdeInicio / 60) * PX_POR_HORA;
    const height = (duracion / 60) * PX_POR_HORA;
    return { top, height };
  }

  // Calcular hora de fin
  function calcularHoraFin(horaInicio, duracion) {
    const [h, m] = horaInicio.split(':').map(Number);
    const totalMin = h * 60 + m + duracion;
    const hh = Math.floor(totalMin / 60);
    const mm = totalMin % 60;
    return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  // Snap a slot de tiempo
  function snapToSlot(y) {
    let totalMin = (y / PX_POR_HORA) * 60 + HORA_INICIO * 60;
    totalMin = Math.floor(totalMin / SLOT_MINUTOS) * SLOT_MINUTOS;
    totalMin = Math.max(HORA_INICIO * 60, Math.min(totalMin, (20 * 60) - SLOT_MINUTOS));
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const hora = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    const top = (totalMin / 60 - HORA_INICIO) * PX_POR_HORA;
    return { hora, top };
  }

  // Colores y etiquetas de estados
  const ESTADOS_COLORS = {
    'pendiente': '#6cd9f4',
    'confirmado': '#395ff3',
    'en_recepcion': '#f59e0b',
    'en_atencion': '#d853f3',
    'finalizado': '#16a34a',
    'cancelado': '#9ca3af',
    'ausente': '#dc2626'
  };
  const ESTADOS_LABELS = {
    'pendiente': 'Pendiente',
    'confirmado': 'Confirmado',
    'en_recepcion': 'En recepción',
    'en_atencion': 'En atención',
    'finalizado': 'Finalizado',
    'cancelado': 'Cancelado',
    'ausente': 'Ausente'
  };

  // ============================================================
  // RENDER AGENDA PRINCIPAL
  // ============================================================
  function renderAgenda() {
    const el = $('view-agenda');

    // Calcular semana actual
    const lunes = obtenerLunes(semanaActual);
    const fechas = getSemanaFechas(lunes);
    const hoy = new Date().toISOString().slice(0, 10);

    // Construir el HTML
    el.innerHTML = `
      <div class="page-header" style="margin-bottom:0;">
        <div>
          <div class="page-title">Agenda</div>
          <div class="page-subtitle">Semana del ${fechas[0].split('-').reverse().join('/')} al ${fechas[6].split('-').reverse().join('/')}</div>

          <!-- Filtros -->

            <select id="filtro-odontologo-agenda" class="form-control" style="width:180px;" onchange="aplicarFiltrosAgenda()">

              <option value="todos">Todas las sucursales</option>
            </select>

          <!-- Botón Bloquear -->
          <button onclick="openModalBloqueo()" class="btn btn-secondary btn-sm">🔒 Bloquear</button>
          <!-- Selector de vista -->
          <div style="display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;">
            <button class="btn btn-sm btn-secondary" style="border-radius:0;border:none;" onclick="cambiarVista('dia')">Día</button>
            <span class="btn btn-sm" style="border-radius:0;background:var(--primary);color:#fff;cursor:default;border:none;border-left:1px solid var(--border);">Semana</span>
            <button class="btn btn-sm btn-secondary" style="border-radius:0;border:none;border-left:1px solid var(--border);" onclick="cambiarVista('mes')">Mes</button>
            <button class="btn btn-sm btn-secondary" style="border-radius:0;border:none;border-left:1px solid var(--border);" onclick="cambiarVista('lista')">Lista</button>
          </div>
          <!-- Nuevo turno -->
          <a href="#" class="btn btn-primary btn-sm" onclick="openModalNuevoTurnoAgenda('${hoy}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo turno
          </a>
          <!-- Urgencia -->
          <a href="#" class="btn btn-sm" style="background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;" onclick="openModalNuevoTurnoAgenda('${hoy}', true)">⚡ Urgencia</a>
        </div>
      </div>

      <!-- Navegación semanal -->
      <div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:16px;flex-wrap:nowrap;height:79px;">
        <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(-1)">← Anterior</button>
        <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(0)">Hoy</button>
        <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(1)">Siguiente →</button>

        <!-- Panel de reprogramación (oculto inicialmente) -->
        <div id="reprog-panel" style="display:none;background:#fffbeb;border:2px solid #f59e0b;border-radius:10px;padding:10px 14px;align-items:center;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-size:10px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;">📅 Reprogramar turno</div>
            <div id="rp-paciente" style="font-size:13px;font-weight:700;color:#1e2d3a;"></div>
            <div id="rp-info" style="font-size:11px;color:#64748b;margin-top:1px;"></div>
          </div>
          <div style="font-size:11px;color:#92400e;background:rgba(245,158,11,.15);padding:5px 10px;border-radius:6px;white-space:nowrap;">
            Hacé click en la celda donde querés mover el turno
          </div>
          <button onclick="exitReprogramarMode()" class="btn btn-secondary btn-sm" style="white-space:nowrap;flex-shrink:0;">✕ Cancelar</button>
        </div>
      </div>

      <!-- Calendario -->
      <div id="cal-wrap" style="background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;">

        <!-- Headers de días -->
        <div id="cal-headers" style="display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:2px solid var(--border);">
          <div></div>
          ${fechas.map((f, idx) => {
            const diaNum = new Date(f + 'T00:00:00').getDate();
            const esHoy = f === hoy;
            const diaSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'][idx];
            return `
              <div data-col-idx="${idx}" style="padding:10px 8px;text-align:center;border-left:1px solid var(--border);${esHoy ? 'background:var(--accent-light,#e8f4f8);' : ''}">
                <div style="font-size:11px;color:var(--text-muted);font-weight:500;">${diaSemana}</div>
                <div style="font-size:20px;font-weight:800;${esHoy ? 'color:var(--primary);' : 'color:var(--text);'}line-height:1.2;">${diaNum}</div>
                <div class="turnos-count" style="font-size:10px;color:var(--text-muted);">0 turnos</div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- Cuerpo del calendario -->
        <div id="cal-body" style="display:grid;grid-template-columns:52px repeat(7,1fr);overflow-y:auto;max-height:1556px;">

          <!-- Columna de horas -->
          <div style="position:relative;height:1536px;">
            ${Array.from({length:12}, (_, i) => HORA_INICIO + i).map(h => `
              <div style="position:absolute;top:${(h - HORA_INICIO) * PX_POR_HORA}px;right:6px;font-size:10px;color:var(--text-muted);line-height:1;">${String(h).padStart(2,'0')}:00</div>
            `).join('')}

          <!-- Columnas de días -->
          ${fechas.map((fecha, colIdx) => `
            <div class="cal-col"
                 data-fecha="${fecha}"

              <!-- Fondo alternado -->
              ${Array.from({length:24}, (_, i) => {
                const top = i * 64;
                if (i % 2 === 0) {
                  return `<div style="position:absolute;top:${top}px;left:0;right:0;height:64px;background:#f0f7ff;pointer-events:none;z-index:0;"></div>`;
                }
                return '';
              }).join('')}

              <!-- Líneas de hora -->
              ${Array.from({length:13}, (_, i) => {
                const top = i * PX_POR_HORA;
                return `<div style="position:absolute;top:${top}px;left:0;right:0;border-top:${i % 1 === 0 ? '1px solid #dde8f0' : '1px dashed #e8edf2'};pointer-events:none;z-index:1;"></div>`;
              }).join('')}

                   style="position:absolute;inset:0;z-index:2;cursor:pointer;"

              <!-- Contenedor de turnos (se llena con JS) -->
              <div class="turnos-container" style="position:absolute;inset:0;z-index:3;pointer-events:none;"></div>

            </div>
          `).join('')}

        </div>
      </div>

      <!-- Leyenda -->
      <div id="leyenda-agenda" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;align-items:center;">

  // ============================================================
  // CARGAR TURNOS DESDE FIRESTORE
  // ============================================================
  function cargarTurnosSemana(fechas) {
    const fechaInicio = fechas[0];
    const fechaFin = fechas[6];

    db.collection('turnos')
      .where('fecha', '>=', fechaInicio)
      .where('fecha', '<=', fechaFin)
      .onSnapshot((snapshot) => {
        // Limpiar turnos existentes
        document.querySelectorAll('.turnos-container').forEach(container => {
          container.innerHTML = '';
        });

        // Resetear contadores
        document.querySelectorAll('.turnos-count').forEach(el => {
          el.textContent = '0 turnos';
        });

        // Agrupar turnos por fecha
        const turnosPorFecha = {};
        fechas.forEach(f => turnosPorFecha[f] = []);

        snapshot.forEach(doc => {
          const turno = doc.data();
          const fecha = turno.fecha;
          if (turnosPorFecha[fecha]) {
            turnosPorFecha[fecha].push({ id: doc.id, ...turno });
          }
        });

        // Renderizar turnos
        fechas.forEach(fecha => {
          const turnos = turnosPorFecha[fecha] || [];
          const container = document.querySelector(`.cal-col[data-fecha="${fecha}"] .turnos-container`);
          if (!container) return;

          // Actualizar contador
          const header = document.querySelector(`[data-col-idx="${fechas.indexOf(fecha)}"] .turnos-count`);
          if (header) header.textContent = `${turnos.length} ${turnos.length === 1 ? 'turno' : 'turnos'}`;

          // Ordenar turnos por hora
          turnos.sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));

          // Calcular columnas para solapamientos
          const slots = [];
          turnos.forEach(turno => {
            const { top, height } = calcularPosicion(turno.hora || '08:00', turno.duracion || 30);
            let col = 0;
            let ocupado = true;
            while (ocupado) {
              ocupado = slots.some(s => s.col === col && s.top < top + height && s.top + s.height > top);
              if (ocupado) col++;
            }
            slots.push({ col, top, height, turno });
          });

          // Renderizar cada turno
          slots.forEach(({ col, top, height, turno }) => {
            const esUrgencia = turno.es_urgencia || false;
            const color = esUrgencia ? '#dc2626' : (turno.color || '#355063');
            const estado = turno.estado || 'pendiente';
            const esCancelado = estado === 'cancelado' || estado === 'ausente';
            const opacity = esCancelado ? '0.45' : '1';

            const bloque = document.createElement('div');
            bloque.className = 'turno-block';
            bloque.draggable = true;
            bloque.dataset.id = turno.id;
            bloque.dataset.dur = turno.duracion || 30;
            bloque.dataset.fwFecha = turno.fecha;
            bloque.dataset.fwHora = turno.hora || '08:00';
            bloque.dataset.fwOdo = turno.odontologo_id || '0';
            bloque.dataset.origRightPct = col > 0 ? Math.round(100 / (col + 1)) : 0;

            const width = col === 0 ? 100 : Math.round(100 / (col + 1));
            const left = col > 0 ? Math.round((col / (col + 1)) * 100) : 0;

            bloque.style.cssText = `
              position:absolute;
              left:${left}%;
              right:${col > 0 ? (100 - left - width) : 0}%;
              top:${top}px;
              height:${height - 2}px;
              background:${color};
              border-radius:5px;
              padding:3px 5px;
              overflow:hidden;
              z-index:3;
              cursor:pointer;
              opacity:${opacity};
              pointer-events:auto;
              ${esUrgencia ? 'border:2px solid #991b1b;box-shadow:0 0 6px rgba(220,38,38,.4);' : ''}
              transition:right .18s ease;
            `;

            const horaMostrar = turno.hora || '--:--';
            const paciente = turno.paciente || 'Sin paciente';
            const estadoLabel = ESTADOS_LABELS[estado] || estado;
            const tratamiento = turno.tratamiento || '';

            bloque.innerHTML = `
              <div style="font-size:10px;font-weight:700;color:#fff;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;">
                ${esUrgencia ? '⚡ ' : ''}${horaMostrar} ${paciente}
              </div>
              <div style="display:flex;align-items:center;gap:4px;margin-top:1px;pointer-events:none;">
                <span style="font-size:9px;font-weight:700;color:#fff;background:${ESTADOS_COLORS[estado] || '#6cd9f4'};border-radius:3px;padding:1px 5px;white-space:nowrap;flex-shrink:0;">${estadoLabel}</span>
                ${tratamiento ? `<span style="font-size:9px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${tratamiento}</span>` : ''}
              </div>
              <div class="resize-handle" style="position:absolute;bottom:0;left:0;right:0;height:8px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;z-index:4;" title="Arrastrar para cambiar duración">
                <div style="width:20px;height:2px;background:rgba(255,255,255,.6);border-radius:2px;pointer-events:none;"></div>
              </div>
            `;

            bloque.dataset.popup = JSON.stringify({
              id: turno.id,
              paciente: paciente,
              paciente_nombre: paciente,
              telefono: turno.telefono || '',
              duracion: turno.duracion || 30,
              hora: `${horaMostrar} – ${calcularHoraFin(horaMostrar, turno.duracion || 30)}`,
              hora_inicio: horaMostrar,
              fecha: turno.fecha,
              trat: tratamiento,
              doc: turno.odontologo || 'Profesional',
              odontologo_nombre: turno.odontologo || 'Profesional',
              estado: estado,
              color: color,
              urgencia: esUrgencia,
              edit_url: '#',
              reprog_url: '#',
              del_url: '#',
              pago_url: '#',
              tratamientos: turno.tratamientos_realizados || [],
              total: turno.total_paciente || 0
            });

            bloque.addEventListener('click', function(e) {
              e.stopPropagation();
              mostrarPopupTurno(this);
            });

            bloque.addEventListener('dragstart', function(e) {
              e.dataTransfer.effectAllowed = 'move';
              this.style.opacity = '0.4';
            });
            bloque.addEventListener('dragend', function() {
              this.style.opacity = '';
            });

            container.appendChild(bloque);
          });

          // Agregar botón "+" para crear turno rápido (hover)
          // ... (se implementa con CSS y JS en el attachDragDropListeners)
        });

        attachDragDropListeners();

      }, (error) => {
        console.error('Error cargando turnos:', error);
      });
  }

  // ============================================================
  // DRAG & DROP LISTENERS
  // ============================================================
  function attachDragDropListeners() {
    // Configurar columnas para drag & drop
    document.querySelectorAll('.cal-col').forEach(col => {
      col.addEventListener('dragover', function(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const existing = col.querySelector('.drop-indicator');
        if (!existing) {
          const ind = document.createElement('div');
          ind.className = 'drop-indicator';
          ind.style.cssText = 'position:absolute;left:2px;right:2px;height:2px;background:var(--primary);z-index:20;pointer-events:none;border-radius:2px;';
          col.appendChild(ind);
        }
        const rect = col.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const snap = snapToSlot(y);
        col.querySelector('.drop-indicator').style.top = snap.top + 'px';
      });

      col.addEventListener('dragleave', function() {
        const ind = col.querySelector('.drop-indicator');
        if (ind) ind.remove();
      });

      col.addEventListener('drop', function(e) {
        e.preventDefault();
        const ind = col.querySelector('.drop-indicator');
        if (ind) ind.remove();

        const turnoId = e.dataTransfer.getData('text/plain');
        if (!turnoId) return;

        const fecha = this.dataset.fecha;
        const rect = this.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const snap = snapToSlot(y);

        if (confirm(`¿Mover turno a ${fecha} a las ${snap.hora}?`)) {
          moverTurno(turnoId, fecha, snap.hora);
        }
      });
    });

    // Configurar turnos para drag
    document.querySelectorAll('.turno-block').forEach(block => {
      block.addEventListener('dragstart', function(e) {
        e.dataTransfer.setData('text/plain', this.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
    });
  }

  function renderObrasSociales() {
    const el = $('view-obras_sociales');
    el.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Obras sociales</div>
          <div class="page-subtitle" id="os-count">Cargando...</div>
        </div>
        <button class="btn btn-primary" onclick="openModalNuevaObraSocial()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          + Nueva obra social
        </button>
      </div>

      <div id="os-list-container" style="display:flex;flex-direction:column;gap:12px;">
        <p class="text-muted">Cargando obras sociales...</p>
      </div>
    `;

    db.collection('obras_sociales').orderBy('nombre').onSnapshot(snap => {
      const container = $('os-list-container');
      const countEl = $('os-count');

      if (snap.empty) {
        container.innerHTML = '<div class="card"><p class="text-muted">No hay obras sociales registradas.</p></div>';
        if (countEl) countEl.textContent = '0 registradas';
        return;
      }

      let html = '';
      let totalOS = 0;

      snap.forEach(doc => {
        const data = doc.data();
        const id = doc.id;
        totalOS++;

        const planes = data.planes || [];
        const cantidadPlanes = planes.length;

        let detalles = [];
        if (data.codigo) detalles.push(`<span>Cód: ${data.codigo}</span>`);
        if (data.email) detalles.push(`<span>${data.email}</span>`);
        detalles.push(`<span>${cantidadPlanes} ${cantidadPlanes === 1 ? 'plan' : 'planes'}</span>`);

        html += `
          <div class="card" style="padding:0;overflow:hidden;">
            <div class="os-card-header">
              <div style="display:flex;align-items:center;gap:14px;">
                <div style="width:40px;height:40px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </div>
                <div>
                  <div style="font-size:15px;font-weight:700;color:var(--text);">${data.nombre || 'Sin nombre'}</div>
                  <div style="font-size:12px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px;">
                    ${detalles.join(' · ')}
                  </div>
                </div>
              </div>
              <div style="display:flex;gap:6px;align-items:center;">
                <button class="btn btn-sm btn-secondary" onclick="openModalNuevoPlan('${id}')">+ Plan</button>
                <button class="btn btn-sm btn-secondary" onclick="openModalEditarObraSocial('${id}')">Editar</button>
                <button class="btn btn-sm" style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;" onclick="eliminarObraSocial('${id}')">Eliminar</button>
              </div>
            </div>

            <div style="padding:10px 20px 12px;">
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:8px;">Planes</div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;">
        `;

        if (cantidadPlanes === 0) {
          html += `<span style="font-size:13px;color:var(--text-muted);">Sin planes cargados</span>`;
        } else {
          planes.forEach(plan => {
            html += `
              <div style="display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 12px;">
                <div>
                  <span style="font-size:13px;font-weight:600;color:var(--text);">${plan.nombre || 'Plan sin nombre'}</span>
                  ${plan.descripcion ? `<div style="font-size:11px;color:var(--text-muted);">${plan.descripcion}</div>` : ''}
                </div>
                <div style="display:flex;gap:4px;margin-left:4px;">
                  <button class="btn btn-sm btn-secondary" style="padding:2px 8px;font-size:11px;" onclick="openModalEditarPlan('${id}', '${plan.id || ''}')">Editar</button>
                  <button class="btn btn-sm" style="padding:2px 8px;font-size:11px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;" onclick="eliminarPlan('${id}', '${plan.id || ''}')">✕</button>
                </div>
              </div>
            `;
          });
        }

        html += `
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      if (countEl) countEl.textContent = `${totalOS} ${totalOS === 1 ? 'registrada' : 'registradas'}`;
    }, error => {
      console.error('Error cargando obras sociales:', error);
      $('os-list-container').innerHTML = '<div class="card"><p class="text-muted">Error al cargar los datos.</p></div>';
    });
  }

  window.agregarCampoPlan = function() {
    planCounter++;
    const container = document.getElementById('planes-container');
    const div = document.createElement('div');
    div.style.display = 'flex';
    div.style.gap = '8px';
    div.style.marginBottom = '6px';
    div.innerHTML = `
      <input class="form-control" id="f-plan-${planCounter}" placeholder="Nombre del plan" style="flex:1;">
      <input class="form-control" id="f-plan-desc-${planCounter}" placeholder="Descripción" style="flex:1;">
      <button type="button" class="btn btn-sm" style="background:#fef2f2;color:#dc2626;border:1px solid #fecaca;padding:4px 8px;" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(div);
  };

  window.guardarObraSocialCompleta = function() {
    const nombre = document.getElementById('f-os-nombre').value.trim();
    const codigo = document.getElementById('f-os-codigo').value.trim();
    const email = document.getElementById('f-os-email').value.trim();

    if (!nombre) return alert('El nombre es obligatorio.');

    const planes = [];
    for (let i = 1; i <= planCounter; i++) {
      const nombrePlan = document.getElementById(`f-plan-${i}`);
      const descPlan = document.getElementById(`f-plan-desc-${i}`);
      if (nombrePlan && nombrePlan.value.trim()) {
        planes.push({
          id: Date.now().toString() + i,
          nombre: nombrePlan.value.trim(),
          descripcion: descPlan ? descPlan.value.trim() : ''
        });
      }
    }

    db.collection('obras_sociales').add({
      nombre,
      codigo,
      email,
      planes: planes,
      creado: new Date().toISOString()
    }).then(() => {
      closeModal();
      planCounter = 1;
      showToast('✅ Obra social creada exitosamente.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  window.guardarPlan = function(osId) {
    const nombre = $('f-plan-nombre').value.trim();
    const descripcion = $('f-plan-desc').value.trim();
    if (!nombre) return alert('El nombre del plan es obligatorio.');

    const plan = {
      id: Date.now().toString(),
      nombre,
      descripcion
    };

    db.collection('obras_sociales').doc(osId).update({
      planes: firebase.firestore.FieldValue.arrayUnion(plan)
    }).then(() => {
      closeModal();
      showToast('✅ Plan agregado.');
    }).catch(err => alert('❌ Error: ' + err.message));

  window.openModalEditarPlan = function(osId, planId) {
    db.collection('obras_sociales').doc(osId).get().then(doc => {
      if (!doc.exists) return alert('No encontrada');
      const data = doc.data();
      const planes = data.planes || [];
      const plan = planes.find(p => p.id === planId);
      if (!plan) return alert('Plan no encontrado');

      openModal(`
        <div class="modal-title">✏️ Editar plan</div>
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input class="form-control" id="f-plan-edit-nombre" value="${plan.nombre || ''}">
        </div>
        <div class="form-group">
          <label class="form-label">Descripción</label>
          <input class="form-control" id="f-plan-edit-desc" value="${plan.descripcion || ''}">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarEdicionPlan('${osId}', '${planId}')">Actualizar</button>
        </div>
      `);
    });

  window.guardarEdicionPlan = function(osId, planId) {
    const nombre = $('f-plan-edit-nombre').value.trim();
    const descripcion = $('f-plan-edit-desc').value.trim();
    if (!nombre) return alert('El nombre es obligatorio.');

    db.collection('obras_sociales').doc(osId).get().then(doc => {
      if (!doc.exists) return alert('No encontrada');
      const data = doc.data();
      const planes = data.planes || [];
      const index = planes.findIndex(p => p.id === planId);
      if (index === -1) return alert('Plan no encontrado');

      planes[index] = { ...planes[index], nombre, descripcion };
      return db.collection('obras_sociales').doc(osId).update({ planes });
    }).then(() => {
      closeModal();
      showToast('✅ Plan actualizado.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  window.eliminarPlan = function(osId, planId) {
    if (!confirm('¿Eliminar este plan?')) return;

    db.collection('obras_sociales').doc(osId).get().then(doc => {
      if (!doc.exists) return alert('No encontrada');
      const data = doc.data();
      const planes = data.planes || [];
      const nuevosPlanes = planes.filter(p => p.id !== planId);
      return db.collection('obras_sociales').doc(osId).update({ planes: nuevosPlanes });
    }).then(() => {
      showToast('🗑 Plan eliminado.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  window.guardarLiquidacionOS = function() {
    const obraSocialId = $('f-liq-os').value;
    const obraSocial = $('f-liq-os').options[$('f-liq-os').selectedIndex]?.text || '';
    const plan = $('f-liq-plan').value.trim();
    const periodo = $('f-liq-periodo').value.trim();
    const monto = parseFloat($('f-liq-monto').value);
    const estado = $('f-liq-estado').value;
    const fecha = $('f-liq-fecha').value;
    const comisionPct = parseFloat($('f-liq-comision-pct').value) || 0;

    if (!obraSocialId) return alert('Seleccioná una obra social.');
    if (!periodo) return alert('El período es obligatorio.');
    if (isNaN(monto) || monto <= 0) return alert('Ingresá un monto válido.');

    const comision = monto * (comisionPct / 100);

    db.collection('liquidaciones_os').add({
      obra_social_id: obraSocialId,
      obra_social: obraSocial,
      plan: plan,
      periodo: periodo,
      monto: monto,
      comision_pct: comisionPct,
      comision: comision,
      estado: estado,
      fecha: fecha || new Date().toISOString().slice(0,10),
      creado: new Date().toISOString()
    }).then(() => {
      closeModal();
      showToast('✅ Liquidación OS creada exitosamente.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  window.guardarEdicionLiquidacionOS = function(id) {
    const obraSocialId = $('f-liq-edit-os').value;
    const obraSocial = $('f-liq-edit-os').options[$('f-liq-edit-os').selectedIndex]?.text || '';
    const plan = $('f-liq-edit-plan').value.trim();
    const periodo = $('f-liq-edit-periodo').value.trim();
    const monto = parseFloat($('f-liq-edit-monto').value);
    const estado = $('f-liq-edit-estado').value;
    const fecha = $('f-liq-edit-fecha').value;
    const comisionPct = parseFloat($('f-liq-edit-comision-pct').value) || 0;

    if (!obraSocialId) return alert('Seleccioná una obra social.');
    if (!periodo) return alert('El período es obligatorio.');
    if (isNaN(monto) || monto <= 0) return alert('Ingresá un monto válido.');

    const comision = monto * (comisionPct / 100);

    db.collection('liquidaciones_os').doc(id).update({
      obra_social_id: obraSocialId,
      obra_social: obraSocial,
      plan: plan,
      periodo: periodo,
      monto: monto,
      comision_pct: comisionPct,
      comision: comision,
      estado: estado,
      fecha: fecha || new Date().toISOString().slice(0,10)
    }).then(() => {
      closeModal();
      showToast('✅ Liquidación actualizada.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  window.eliminarLiquidacionOS = function(id) {
    if (!confirm('¿Eliminar esta liquidación?')) return;
    db.collection('liquidaciones_os').doc(id).delete()
      .then(() => showToast('🗑 Eliminada.'))
      .catch(err => alert('❌ Error: ' + err.message));
  };

  window.cambiarEstadoLiquidacionOS = function(id, nuevoEstado) {

      'anulada': '¿Anular esta liquidación?'

    if (!confirm(mensajes[nuevoEstado] || '¿Cambiar el estado?')) return;

    db.collection('liquidaciones_os').doc(id).update({ estado: nuevoEstado })
      .then(() => showToast(`✅ Estado cambiado a ${nuevoEstado}.`))
      .catch(err => alert('❌ Error: ' + err.message));
  };

  let filterCategoria = 'Todos';
  let filterEstado = 'Todos';
  let filterAgendaVirtual = false;
  let allTratamientosData = [];

  function renderTratamientos() {
    const el = $('view-tratamientos');
    el.innerHTML = `

        <button class="btn btn-sm btn-secondary" data-filter="Inactivos" onclick="setFilterEstado('Inactivos')">Inactivos</button>
        <button class="btn btn-sm btn-secondary" data-filter="AgendaVirtual" onclick="toggleAgendaVirtual()" style="border-color:var(--accent-light);">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:3px;"><rect x="3" y="3" width="18" height="14" rx="3"/><path d="M8 21l4-4 4 4"/></svg>
          Agenda virtual
        </button>

      <div class="table-wrap" id="tabla-tratamientos">
        <table>
          <thead>
            <tr>
              <th>Tratamiento</th>
              <th>Categoría</th>
              <th>Precio base</th>
              <th>Duración</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody-tratamientos">
          </tbody>
        </table>
      </div>
    `;

    db.collection('tratamientos').onSnapshot(snap => {
      allTratamientosData = [];
      snap.forEach(doc => {
        const data = doc.data();
        allTratamientosData.push({ id: doc.id, ...data });
      });
      actualizarVistaTratamientos();
    }, (error) => {
      console.error('Error en snapshot de tratamientos:', error);
    });
  }

  function actualizarVistaTratamientos() {
    const container = $('tbody-tratamientos');
    const countEl = $('tratamientos-count');
    const pillsContainer = $('categoria-pills');

    const categoriasSet = new Set();
    allTratamientosData.forEach(item => {
      if (item.categoria) categoriasSet.add(item.categoria);
    });
    const counts = {};
    allTratamientosData.forEach(item => {
      const cat = item.categoria || 'sin-categoria';
      counts[cat] = (counts[cat] || 0) + 1;
    });
    const cats = ['Todos', ...Array.from(categoriasSet).sort()];
    let pillsHtml = '';
    cats.forEach(cat => {
      const count = cat === 'Todos' ? allTratamientosData.length : counts[cat] || 0;
      const activa = filterCategoria === cat ? 'activa' : '';
      pillsHtml += `<button class="pill-categoria ${activa}" onclick="setFilterCategoria('${cat}')">${cat === 'Todos' ? 'Todos' : cat.charAt(0).toUpperCase() + cat.slice(1)} <span class="contador">${count}</span></button>`;
    });
    pillsContainer.innerHTML = pillsHtml;

    let filtered = allTratamientosData;
    if (filterCategoria !== 'Todos') {
      filtered = filtered.filter(item => item.categoria === filterCategoria);
    }
    if (filterEstado === 'Activos') {
      filtered = filtered.filter(item => item.activo !== false);
    } else if (filterEstado === 'Inactivos') {
      filtered = filtered.filter(item => item.activo === false);
    }
    if (filterAgendaVirtual) {
      filtered = filtered.filter(item => item.agenda_virtual === true);
    }
    filtered.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

    if (countEl) {
      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'tratamiento' : 'tratamientos'}`;
    }

    if (filtered.length === 0) {
      container.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:30px;color:#94a3b8;">No hay tratamientos que coincidan con los filtros.</td></tr>`;
      return;
    }

    const coloresCategoria = {
      'cirugia': 'badge-red',
      'consulta': 'badge-teal',
      'diagnostico': 'badge-gray',
      'endodoncia': 'badge-amber',
      'estetica': 'badge-teal',
      'implante': 'badge-gray',
      'limpieza': 'badge-blue',
      'odontopediatria': 'badge-gray',
      'ortodoncia': 'badge-blue',
      'protesis': 'badge-gray',
      'restauracion': 'badge-green'
    };
    const getColorCategoria = (cat) => coloresCategoria[cat] || 'badge-gray';

    let htmlFilas = '';
    filtered.forEach((item) => {
      const activo = item.activo !== undefined ? item.activo : true;
      const estadoBadge = activo ? 'badge-estado-activo' : 'badge-estado-inactivo';
      const estadoTexto  = activo ? 'Activo' : 'Inactivo';
      const nombreCategoria = (item.categoria || 'sin categoría').charAt(0).toUpperCase() + (item.categoria || '').slice(1);

      let etiquetas = '';
      if (item.agenda_virtual) {
        etiquetas += `<span class="badge-etiqueta azul"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle"><rect x="3" y="3" width="18" height="14" rx="3"/><path d="M8 21l4-4 4 4"/></svg> Agenda virtual</span> `;
      }
      if (item.requiere_lab) {
        etiquetas += `<span class="badge-etiqueta ambar">Requiere laboratorio</span> `;
      }

      htmlFilas += `
        <tr>
          <td>
            <div style="font-weight:600">${item.nombre || ''}</div>
            <div style="font-size:11px;color:#64748b;">Cód. ${item.codigo || '—'}</div>
            <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${etiquetas}</div>
          </td>
          <td><span class="badge ${getColorCategoria(item.categoria)}">${nombreCategoria}</span></td>
          <td style="font-weight:600">$ ${Number(item.precio_base || 0).toLocaleString()}</td>
          <td style="font-size:13px;color:#64748b;">${item.duracion || '30 min'}</td>
          <td>
            <button class="badge ${estadoBadge}" style="border:none;cursor:pointer;font-size:11px;" onclick="toggleEstado('${item.id}')">
              ${estadoTexto}
            </button>
          </td>
          <td>
            <div style="display:flex;gap:6px">
              <button class="btn btn-secondary btn-sm" onclick="openModalEditarTratamiento('${item.id}')">Editar</button>
              <button class="btn btn-secondary btn-sm" onclick="openModalOS('${item.id}')" title="Configurar cobertura por obra social">🏥 OS</button>
              <button class="btn btn-danger btn-sm" onclick="eliminarTratamiento('${item.id}')">🗑</button>
            </div>
          </td>
        </tr>
      `;
    });
    container.innerHTML = htmlFilas;
  }

  function setFilterCategoria(cat) {
    filterCategoria = cat;
    actualizarVistaTratamientos();
  }

  function setFilterEstado(estado) {
    filterEstado = estado;
    if (estado !== 'AgendaVirtual') filterAgendaVirtual = false;
    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-secondary');
      if (btn.dataset.filter === estado) {
        btn.classList.remove('btn-secondary');
        btn.classList.add('btn-primary');
      }
    });
    actualizarVistaTratamientos();
  }

  function toggleAgendaVirtual() {
    filterAgendaVirtual = !filterAgendaVirtual;
    const btn = document.querySelector('[data-filter="AgendaVirtual"]');
    if (btn) {
      btn.classList.toggle('btn-primary', filterAgendaVirtual);
      btn.classList.toggle('btn-secondary', !filterAgendaVirtual);
    }
    actualizarVistaTratamientos();
  }

  function toggleEstado(id) {
    const trat = allTratamientosData.find(t => t.id === id);
    if (!trat) return;
    const nuevoEstado = !trat.activo;
    db.collection('tratamientos').doc(id).update({ activo: nuevoEstado })
      .then(() => showToast(`Estado cambiado a ${nuevoEstado ? 'Activo' : 'Inactivo'}`))
      .catch(err => alert('❌ Error: ' + err.message));
  }

    const precio_base = parseFloat($('f-trat-edit-precio').value) || 0;
    const duracion = $('f-trat-edit-duracion').value.trim() || '30 min';
    const activo = $('f-trat-edit-activo').checked;

    if (!nombre) return alert('El nombre es obligatorio.');
    if (!categoria) return alert('Selecciona una categoría.');

    db.collection('tratamientos').doc(id).update({
      nombre, codigo, categoria, precio_base, duracion, activo
    }).then(() => {
      closeModal();
      showToast('✅ Tratamiento actualizado.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  window.openModalOS = function(id) {
    db.collection('tratamientos').doc(id).get().then(doc => {
      if (!doc.exists) return alert('Tratamiento no encontrado');
      const data = doc.data();
      const precioActual = data.precio_os !== undefined ? data.precio_os : data.precio_base;

      openModal(`
        <div class="modal-title">🏥 Actualizar precio para Obra Social</div>
        <div style="margin-bottom:16px;">
          <div><strong>${data.nombre || ''}</strong></div>
          <div class="text-muted" style="font-size:13px;">Precio base actual: $${Number(data.precio_base || 0).toLocaleString()}</div>
        </div>
        <div class="form-group">
          <label class="form-label">Nuevo precio OS ($)</label>
          <input class="form-control" id="f-os-precio" type="number" step="0.01" value="${precioActual}" min="0">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarOS('${id}')">Guardar precio OS</button>
        </div>
      `);
    });
  };

  window.guardarOS = function(id) {
    const nuevoPrecio = parseFloat($('f-os-precio').value);
    if (isNaN(nuevoPrecio) || nuevoPrecio < 0) {
      return alert('Ingresa un número válido (mayor o igual a 0)');
    }
    db.collection('tratamientos').doc(id).update({
      precio_os: nuevoPrecio
    }).then(() => {
      closeModal();
      showToast('✅ Precio OS actualizado correctamente.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  window.eliminarTratamiento = function(id) {
    if (!confirm('¿Eliminar este tratamiento de forma permanente?')) return;
    db.collection('tratamientos').doc(id).delete()
      .then(() => showToast('🗑 Tratamiento eliminado.'))
      .catch(err => alert('❌ Error: ' + err.message));
  };

  // ============================================================
  // ESPECIALIDADES (sin cambios)
  // ============================================================
  function renderEspecialidades() {
    const el = $('view-especialidades');
    el.innerHTML = `
      <div class="page-header"><div><div class="page-title">Especialidades</div></div>
        <button class="btn btn-primary" onclick="openModalNuevaEspecialidad()">+ Nueva especialidad</button>
      </div>
      <div class="card"><div id="especialidades-list"><p class="text-muted">Cargando...</p></div></div>
    `;
    db.collection('especialidades').orderBy('nombre').onSnapshot(snap => {
      let html = '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th></th></tr></thead><tbody>';
      snap.forEach(d => {
        const data = d.data();
        html += `<tr><td>${data.nombre||''}</td>
          <td><button class="btn btn-sm btn-danger" onclick="eliminarEspecialidad('${d.id}')">Eliminar</button></td></tr>`;
      });
      html += '</tbody></table></div>';
      $('especialidades-list').innerHTML = html || '<p class="text-muted">Sin especialidades</p>';
    });
  }

  window.openModalNuevaEspecialidad = function() {
    openModal(`
      <div class="modal-title">Nueva especialidad</div>
      <div class="form-group"><label class="form-label">Nombre</label><input class="form-control" id="f-esp-nombre"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarEspecialidad()">Guardar</button></div>
    `);
  };

  window.guardarEspecialidad = function() {
    const nombre = $('f-esp-nombre').value.trim();
    if (!nombre) return alert('Nombre requerido');
    db.collection('especialidades').add({ nombre })
      .then(() => { closeModal(); showToast('Guardado'); });
  };

  window.eliminarEspecialidad = function(id) {
    if (!confirm('¿Eliminar?')) return;
    db.collection('especialidades').doc(id).delete().then(() => showToast('Eliminado'));
  };

  // ============================================================
  // WEB (sin cambios)
  // ============================================================
  function renderWeb() {
    $('view-web').innerHTML = `
      <div class="page-header"><div><div class="page-title">Landing page</div><div class="page-subtitle">Configuración de la página pública</div></div></div>
      <div class="card">
        <div class="form-group"><label class="form-label">Tagline</label><input class="form-control" id="web-tagline" placeholder="Tu sonrisa, nuestra pasión"></div>
        <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-control" id="web-desc" rows="3"></textarea></div>
        <button class="btn btn-primary" onclick="guardarWeb()">Guardar</button>
      </div>
    `;
    db.collection('landing_config').doc('main').get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        $('web-tagline').value = data.tagline||'';
        $('web-desc').value = data.descripcion||'';
      }
    });
  }

  window.guardarWeb = function() {
    const tagline = $('web-tagline').value.trim();
    const descripcion = $('web-desc').value.trim();
    db.collection('landing_config').doc('main').set({ tagline, descripcion, updated: new Date().toISOString() })
      .then(() => showToast('Configuración guardada'));
  };

  // ============================================================
  // WHATSAPP (sin cambios)
  // ============================================================
  function renderWhatsApp() {
    $('view-whatsapp').innerHTML = `
      <div class="page-header"><div><div class="page-title">WhatsApp</div><div class="page-subtitle">Configuración</div></div></div>
      <div class="card">
        <div class="form-group"><label class="form-label">Proveedor</label><select class="form-control" id="wp-proveedor"><option value="evolution">Evolution API</option><option value="meta">Meta (Oficial)</option></select></div>
        <div class="form-group"><label class="form-label">API Key / Token</label><input class="form-control" id="wp-token" placeholder="Token"></div>
        <div class="form-group"><label class="form-label">Mensaje automático</label><textarea class="form-control" id="wp-mensaje" rows="2">Hola {nombre}, recibimos tu mensaje.</textarea></div>
        <button class="btn btn-primary" onclick="guardarWhatsApp()">Guardar</button>
      </div>
    `;
    db.collection('whatsapp_config').doc('main').get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        $('wp-proveedor').value = data.proveedor||'evolution';
        $('wp-token').value = data.token||'';
        $('wp-mensaje').value = data.mensaje_auto||'';
      }
    });
  }

  window.guardarWhatsApp = function() {
    const proveedor = $('wp-proveedor').value;
    const token = $('wp-token').value.trim();
    const mensaje_auto = $('wp-mensaje').value.trim();
    db.collection('whatsapp_config').doc('main').set({ proveedor, token, mensaje_auto, updated: new Date().toISOString() })
      .then(() => showToast('Configuración guardada'));
  };

  // ============================================================
  // CONFIGURACIÓN (sin cambios)
  // ============================================================
  function renderConfiguracion() {
    $('view-configuracion').innerHTML = `
      <div class="page-header"><div><div class="page-title">Configuración</div><div class="page-subtitle">Sucursales y horarios</div></div></div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="font-weight:700">Sucursales</span><button class="btn btn-primary btn-sm" onclick="openModalNuevaSucursal()">+ Agregar</button></div>
        <div id="sucursales-list"><p class="text-muted">Cargando...</p></div>
      </div>
      <div class="card">
        <div class="form-group"><label class="form-label">Zona horaria</label><select class="form-control" id="cfg-timezone"><option value="America/Argentina/Buenos_Aires">UTC-03:00 Buenos Aires</option><option value="UTC">UTC</option></select></div>
        <button class="btn btn-primary" onclick="guardarConfiguracion()">Guardar</button>
      </div>
    `;
    db.collection('sucursales').orderBy('nombre').onSnapshot(snap => {
      let html = '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Dirección</th><th></th></tr></thead><tbody>';
      snap.forEach(d => {
        const data = d.data();
        html += `<tr><td>${data.nombre||''}</td><td>${data.direccion||''}</td>
          <td><button class="btn btn-sm btn-danger" onclick="eliminarSucursal('${d.id}')">Eliminar</button></td></tr>`;
      });
      html += '</tbody></table></div>';
      $('sucursales-list').innerHTML = html || '<p class="text-muted">Sin sucursales</p>';
    });
    db.collection('configuracion').doc('main').get().then(doc => {
      if (doc.exists) $('cfg-timezone').value = doc.data().timezone||'America/Argentina/Buenos_Aires';
    });
  }

  window.openModalNuevaSucursal = function() {
    openModal(`
      <div class="modal-title">Nueva sucursal</div>
      <div class="form-group"><label class="form-label">Nombre</label><input class="form-control" id="f-suc-nombre"></div>
      <div class="form-group"><label class="form-label">Dirección</label><input class="form-control" id="f-suc-direccion"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarSucursal()">Guardar</button></div>
    `);
  };

  window.guardarSucursal = function() {
    const nombre = $('f-suc-nombre').value.trim();
    const direccion = $('f-suc-direccion').value.trim();
    if (!nombre) return alert('Nombre requerido');
    db.collection('sucursales').add({ nombre, direccion })
      .then(() => { closeModal(); showToast('Guardado'); });
  };

  window.eliminarSucursal = function(id) {
    if (!confirm('¿Eliminar sucursal?')) return;
    db.collection('sucursales').doc(id).delete().then(() => showToast('Eliminado'));
  };

  window.guardarConfiguracion = function() {
    const timezone = $('cfg-timezone').value;
    db.collection('configuracion').doc('main').set({ timezone, updated: new Date().toISOString() })
      .then(() => showToast('Configuración guardada'));
  };

  // ============================================================
  // INICIALIZACIÓN
  // ============================================================
  navigateTo('dashboard');
  $('modal-generic').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

  console.log('Panel DentalSoft completo iniciado con Firebase.');
</script>
</body>
</html>
