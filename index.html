<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Dental · Panel Completo</title>

  <style>
    /* ===== Variables y reset ===== */
    :root {
      --primary: #355063;
      --primary-dark: #1e2d3a;
      --accent: #4285F4;
      --accent-dark: #2b6ed7;
      --accent-light: #e8f0fe;
      --text: #1e2d3a;
      --text-muted: #64748b;
      --bg: #f1f5f9;
      --border: #e2e8f0;
      --white: #ffffff;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #f59e0b;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ===== Topnav ===== */
    .topnav {
      background: var(--primary);
      color: #fff;
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topnav .logo { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .topnav .logo span { font-weight: 300; }
    .topnav .nav-links { display: flex; gap: 8px; margin-left: 24px; }
    .topnav .nav-links a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: var(--radius);
      transition: 0.2s;
    }
    .topnav .nav-links a:hover,
    .topnav .nav-links a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .topnav .nav-right { display: flex; align-items: center; gap: 16px; }
    .topnav .nav-clinic { font-size: 13px; opacity: 0.8; }
    .topnav .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; color: #fff;
    }
    .topnav .user-menu-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .topnav .nav-user-text { text-align: right; line-height: 1.2; }
    .topnav .nav-user-text div:last-child { font-size: 11px; opacity: 0.6; }
    .topnav .user-dropdown {
      display: none; position: absolute; right: 0; top: 100%;
      background: #fff; border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      min-width: 180px; padding: 8px 0; margin-top: 4px;
    }
    .topnav .user-dropdown a {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; color: var(--text); text-decoration: none; font-size: 13px;
    }
    .topnav .user-dropdown a:hover { background: var(--bg); }
    .topnav .user-dropdown a.danger { color: var(--danger); }
    .user-menu-wrap { position: relative; }

    /* ===== Layout ===== */
    .app-layout { display: flex; flex: 1; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 240px;
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 16px 0;
      flex-shrink: 0;
      overflow-y: auto;
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
    }
    .sidebar .sidebar-section { margin-bottom: 24px; }
    .sidebar .sidebar-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-muted);
      padding: 0 16px 8px;
    }
    .sidebar .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px; color: var(--text); text-decoration: none;
      font-size: 14px; border-radius: var(--radius);
      margin: 0 6px; cursor: pointer; transition: 0.15s;
      border: none; background: none; width: calc(100% - 12px); text-align: left;
    }
    .sidebar .sidebar-item:hover { background: var(--bg); }
    .sidebar .sidebar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .sidebar .sidebar-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar .sidebar-item .sb-txt { flex: 1; }

    /* ===== Main ===== */
    .main { flex: 1; padding: 24px 28px; overflow-y: auto; max-height: calc(100vh - 60px); }

    /* ===== Componentes ===== */
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

    .card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); margin-bottom: 20px;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 600; border: 1px solid transparent;
      cursor: pointer; transition: 0.15s; text-decoration: none; line-height: 1.4;
    }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-block { width: 100%; justify-content: center; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 8px 12px;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; background: var(--white); transition: 0.15s;
    }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,133,244,0.15); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; }
    .badge-red { background: #fee2e2; color: #b91c1c; }
    .badge-amber { background: #fef3c7; color: #b45309; }
    .badge-gray { background: #f1f5f9; color: #4b5563; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; background: var(--bg); font-weight: 600; color: var(--text-muted); border-bottom: 2px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover td { background: #fafcff; }

    .tabs {
      display: flex; flex-wrap: wrap; gap: 4px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }
    .tab {
      padding: 10px 18px; font-size: 13px; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: 0.15s; background: none; border-top: none; border-left: none; border-right: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .flex { display: flex; align-items: center; gap: 8px; }
    .gap-4 { gap: 4px; }
    .mt-2 { margin-top: 8px; }
    .mb-2 { margin-bottom: 8px; }
    .text-muted { color: var(--text-muted); }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .w-full { width: 100%; }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 12px 0; }
      .sidebar .sb-txt { display: none; }
      .sidebar .sidebar-item { justify-content: center; padding: 10px; }
      .sidebar .sidebar-label { text-align: center; font-size: 0; }
      .main { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .topnav .nav-links { display: none; }
      .topnav .nav-clinic { display: none; }
    }

    /* ===== Vistas (inicialmente ocultas) ===== */
    .view { display: none; }
    .view.active { display: block; }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
      z-index: 9999; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #fff; border-radius: var(--radius);
      max-width: 700px; width: 100%; padding: 24px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .modal-box .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* Estilos para tratamientos en el modal */
    .trt-grupo { margin-bottom: 4px; }
    .trt-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; border-top: 1px solid var(--border); }
    .trt-item:hover { background: var(--bg); }
    .trt-item .os-split-label { display: none; font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .trt-item .os-pct-badge { display: none; font-size: 10px; font-weight: 700; color: #0891b2; white-space: nowrap; }
  </style>
</head>

  let currentView = 'dashboard';

  function navigateTo(view) {
    if (!views.includes(view)) return;
    currentView = view;
    qsa('.sidebar .sidebar-item[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    qsa('.topnav .nav-links a[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    qsa('.view').forEach(el => el.classList.remove('active'));
    const target = $('view-'+view);
    if (target) target.classList.add('active');
    if (target && target.innerHTML.trim() === '') {
      loadView(view);
    }
  }

  document.querySelectorAll('.sidebar .sidebar-item[data-view]').forEach(btn => {
    btn.addEventListener('click', () => navigateTo(btn.dataset.view));
  });
  document.querySelectorAll('.topnav .nav-links a[data-view]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.preventDefault(); navigateTo(btn.dataset.view); });

  // ============================================================
  // AGENDA (con navegación semanal y carga desde Firestore)
  // ============================================================
  let semanaActual = new Date();

  function obtenerLunes(fecha) {
    const d = new Date(fecha);
    const dia = d.getDay();
    const diff = dia === 0 ? -6 : 1 - dia;
    d.setDate(d.getDate() + diff);
    return d;
  }
  semanaActual = obtenerLunes(new Date());

  function renderAgenda() {
    const el = $('view-agenda');

    const fechas = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(semanaActual);
      d.setDate(semanaActual.getDate() + i);
      fechas.push(d.toISOString().slice(0,10));
    }

    const diasSemana = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

    let headerHtml = `<div></div>`;
    fechas.forEach((f, idx) => {
      const diaNum = new Date(f+'T00:00:00').getDate();
      const esHoy = f === new Date().toISOString().slice(0,10);
      headerHtml += `<div style="padding:10px 8px;text-align:center;${esHoy?'background:var(--accent-light);':''}border-left:1px solid var(--border);">
        <div style="font-size:11px;color:var(--text-muted);font-weight:500">${diasSemana[idx]}</div>
        <div style="font-size:20px;font-weight:800;${esHoy?'color:var(--primary);':''}">${diaNum}</div>
      </div>`;
    });

    const horas = Array.from({length:12}, (_,i) => 8+i);
    let bodyHtml = '';
    bodyHtml += `<div style="position:relative;height:${horas.length*64}px">`;
    horas.forEach((h, idx) => {
      bodyHtml += `<div style="position:absolute;top:${idx*64}px;right:6px;font-size:10px;color:var(--text-muted);">${h}:00</div>`;
    });
    bodyHtml += `</div>`;

    fechas.forEach((fecha) => {
      bodyHtml += `<div data-fecha="${fecha}" style="position:relative;height:${horas.length*64}px;border-left:1px solid var(--border);">`;
      horas.forEach((h, rowIdx) => {
        const top = rowIdx * 64;
        if (rowIdx % 2 === 0) {
          bodyHtml += `<div style="position:absolute;top:${top}px;left:0;right:0;height:64px;background:#f0f7ff;pointer-events:none;"></div>`;
        }
        bodyHtml += `<div style="position:absolute;top:${top}px;left:0;right:0;border-top:1px solid #dde8f0;pointer-events:none;"></div>`;
      });
      bodyHtml += `<div class="day-turnos" data-fecha="${fecha}" style="position:absolute;inset:0;z-index:2;"></div>`;
      bodyHtml += `</div>`;
    });

    const semanaStr = `${fechas[0]} al ${fechas[6]}`;

    el.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Agenda</div>
          <div class="page-subtitle">Semana del ${semanaStr}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(-1)">← Anterior</button>
          <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(0)">Hoy</button>
          <button class="btn btn-secondary btn-sm" onclick="cambiarSemana(1)">Siguiente →</button>
          <button class="btn btn-primary" onclick="openModalNuevoTurno()">+ Nuevo turno</button>
        </div>
      </div>
      <div class="card">
        <div style="display:grid;grid-template-columns:60px repeat(7,1fr);gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:12px;">
          ${headerHtml}
          ${bodyHtml}
        </div>
      </div>
    `;

    const fechaInicio = fechas[0];
    const fechaFin = fechas[6];

    db.collection('turnos')
      .where('fecha', '>=', fechaInicio)
      .where('fecha', '<=', fechaFin)
      .onSnapshot((snapshot) => {
        document.querySelectorAll('.day-turnos').forEach(col => {
          while (col.firstChild) col.removeChild(col.firstChild);
        });

        snapshot.forEach(doc => {
          const turno = doc.data();
          const fecha = turno.fecha;
          const hora = turno.hora;
          if (!fecha || !hora) return;

          const [h, m] = hora.split(':').map(Number);
          if (isNaN(h) || isNaN(m)) return;
          const minutosDesdeInicio = (h - 8) * 60 + m;
          const top = (minutosDesdeInicio / 60) * 64;
          const duracion = turno.duracion || 30;
          const height = (duracion / 60) * 64;

          const columna = document.querySelector(`.day-turnos[data-fecha="${fecha}"]`);
          if (!columna) return;

          const bloque = document.createElement('div');
          bloque.style.cssText = `
            position:absolute; top:${top}px; left:2px; right:2px; height:${height-2}px;
            background:${turno.color || '#355063'}; border-radius:5px; padding:2px 4px;
            overflow:hidden; z-index:3; cursor:pointer;
            font-size:10px; color:#fff; font-weight:600; white-space:nowrap; text-overflow:ellipsis;
          `;
          bloque.textContent = `${hora} ${turno.paciente || 'Sin paciente'}`;
          bloque.title = `${turno.paciente} - ${turno.tratamiento || ''}`;
          bloque.onclick = () => alert(`Turno de ${turno.paciente}\n${turno.fecha} ${turno.hora}\nEstado: ${turno.estado || 'Pendiente'}`);
          columna.appendChild(bloque);
        });

        document.querySelectorAll('.day-turnos').forEach((col, idx) => {
          const count = col.children.length;
          const headerDiv = document.querySelectorAll(`[style*="text-align:center;"]`)[idx+1];
          if (headerDiv) {
            let existing = headerDiv.querySelector('.turnos-count');
            if (!existing) {
              existing = document.createElement('div');
              existing.className = 'turnos-count';
              existing.style.cssText = 'font-size:10px;color:var(--text-muted);margin-top:2px;';
              headerDiv.appendChild(existing);
            }
            existing.textContent = count + ' turnos';
          }
        });
      }, (error) => {
        console.error('Error cargando turnos:', error);
      });
  }

  function cambiarSemana(direccion) {
    if (direccion === 0) {
      semanaActual = obtenerLunes(new Date());
    } else {
      semanaActual.setDate(semanaActual.getDate() + direccion * 7);
    }
    renderAgenda();
  }

  function cargarTratamientosTurno() {
    const container = document.getElementById('trt-lista');
    if (!container) return;

    db.collection('tratamientos').orderBy('categoria').orderBy('nombre').get().then(snap => {
      if (snap.empty) {
        container.innerHTML = '<p class="text-muted" style="padding:12px;text-align:center;">No hay tratamientos cargados</p>';
        return;
      }

      let grupos = {};
      snap.forEach(doc => {
        const data = doc.data();
        const cat = data.categoria || 'otros';
        if (!grupos[cat]) grupos[cat] = [];
        grupos[cat].push({ id: doc.id, ...data });
      });

      let html = '';
      for (const [cat, items] of Object.entries(grupos)) {
        html += `<div class="trt-grupo" data-cat="${cat}">
          <div style="padding:4px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);background:var(--bg);position:sticky;top:0;">${cat}</div>`;
        items.forEach(trat => {
          html += `
            <label class="trt-item" data-nombre="${(trat.nombre || '').toLowerCase()}" style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-top:1px solid var(--border);" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
              <input type="checkbox" name="tratamientos_realizados_ids[]" value="${trat.id}" data-precio="${trat.precio_base || 0}" data-trat-id="${trat.id}" onchange="recalcPrecio()" style="width:15px;height:15px;accent-color:var(--primary);flex-shrink:0;">
              <div style="flex:1;min-width:0;">
                <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${trat.nombre || 'Sin nombre'}</div>
                <div class="os-split-label" style="display:none;font-size:11px;color:var(--text-muted);margin-top:1px;"></div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <div style="font-size:12px;font-weight:600;color:var(--primary);white-space:nowrap;">$${Number(trat.precio_base || 0).toLocaleString()}</div>
                <div class="os-pct-badge" style="display:none;font-size:10px;font-weight:700;color:#0891b2;white-space:nowrap;"></div>
              </div>
            </label>
          `;
        });
        html += `</div>`;
      }
      container.innerHTML = html;
    });

  window.onPacienteChangeTurno = function() {
    const sel = document.getElementById('f-turno-paciente');
    const pid = sel ? parseInt(sel.value) : 0;
    const osData = pid ? PACIENTES_OS[pid] : null;
    currentPlanId = osData ? (osData.plan_id || 0) : 0;

    const banner = document.getElementById('os-banner');
    if (banner) {
      if (osData && currentPlanId) {
        const opt = sel.options[sel.selectedIndex];
        banner.style.display = 'block';
        document.getElementById('os-banner-nombre').textContent = opt.textContent.trim().split('—')[0].trim();
      } else {
        banner.style.display = 'none';
      }
    }

    document.querySelectorAll('#trt-lista input[name="tratamientos_realizados_ids[]"]').forEach(cb => {
      const tid = parseInt(cb.dataset.tratId);
      const precio = parseFloat(cb.dataset.precio) || 0;
      const label = cb.closest('label');
      const splitEl = label ? label.querySelector('.os-split-label') : null;
      const badgeEl = label ? label.querySelector('.os-pct-badge') : null;

      const pct = (currentPlanId && COBERTURAS[tid] && COBERTURAS[tid][currentPlanId])
                  ? parseFloat(COBERTURAS[tid][currentPlanId]) : 0;

      if (splitEl) {
        if (pct > 0 && precio > 0) {
          const montoOS = precio * pct / 100;
          const montoPac = precio - montoOS;
          splitEl.textContent = `Pte: $${montoPac.toFixed(0)} · OS ${pct}%: $${montoOS.toFixed(0)}`;
          splitEl.style.display = 'block';
        } else {
          splitEl.style.display = 'none';
        }
      }
      if (badgeEl) {
        if (pct > 0) {
          badgeEl.textContent = 'OS ' + pct + '%';
          badgeEl.style.display = 'block';
        } else {
          badgeEl.style.display = 'none';
        }
      }
    });

    recalcPrecio();
  };

  function recalcPrecio() {
    const checks = document.querySelectorAll('#trt-lista input[name="tratamientos_realizados_ids[]"]:checked');
    let total = 0, totalPac = 0, totalOS = 0, count = 0;
    checks.forEach(cb => {
      const precio = parseFloat(cb.dataset.precio) || 0;
      const tid = parseInt(cb.dataset.tratId);
      const pct = (currentPlanId && COBERTURAS[tid] && COBERTURAS[tid][currentPlanId])
                  ? parseFloat(COBERTURAS[tid][currentPlanId]) : 0;
      const montoOS = precio * pct / 100;
      total += precio;
      totalOS += montoOS;
      totalPac += precio - montoOS;
      count++;
    });

    const coseguroInp = document.getElementById('coseguro-input');
    const coseguro = coseguroInp ? (parseFloat(coseguroInp.value) || 0) : 0;

    const subtDiv = document.getElementById('trt-subtotal');
    const countEl = document.getElementById('trt-count');
    const totalEl = document.getElementById('trt-total-val');
    const pacEl = document.getElementById('trt-paciente-val');
    const osEl = document.getElementById('trt-os-val');
    const osTotDiv = document.getElementById('os-totales');
    const coseguroRow = document.getElementById('coseguro-row');
    const coseguroEl = document.getElementById('trt-coseguro-val');
    const pacTotalEl = document.getElementById('trt-paciente-total-val');
    const btnCaja = document.getElementById('btn-pago-caja');
    const inpPac = document.getElementById('inp-total-paciente');
    const inpOS = document.getElementById('inp-total-obra-social');

    const hasContent = count > 0 || coseguro > 0;

    if (hasContent) {
      if (countEl) countEl.textContent = count;
      if (totalEl) totalEl.textContent = total.toFixed(0);
      subtDiv.style.display = 'block';

      if (currentPlanId && totalOS > 0) {
        if (pacEl) pacEl.textContent = totalPac.toFixed(0);
        if (osEl) osEl.textContent = totalOS.toFixed(0);
        if (osTotDiv) osTotDiv.style.display = 'block';
      } else {
        if (osTotDiv) osTotDiv.style.display = 'none';
      }

      if (coseguro > 0) {
        if (coseguroEl) coseguroEl.textContent = coseguro.toFixed(0);
        if (pacTotalEl) pacTotalEl.textContent = (totalPac + coseguro).toFixed(0);
        if (coseguroRow) coseguroRow.style.display = 'block';
      } else {
        if (coseguroRow) coseguroRow.style.display = 'none';
      }

      if (inpPac) inpPac.value = totalPac.toFixed(2);
      if (inpOS) inpOS.value = totalOS.toFixed(2);

      if (btnCaja) { btnCaja.disabled = false; btnCaja.style.opacity = '1'; btnCaja.style.cursor = ''; }
    } else {
      subtDiv.style.display = 'none';
      if (coseguroRow) coseguroRow.style.display = 'none';
      if (inpPac) inpPac.value = '';
      if (inpOS) inpOS.value = '';
      if (btnCaja) { btnCaja.disabled = true; btnCaja.style.opacity = '.45'; btnCaja.style.cursor = 'not-allowed'; }
    }
  }

  window.guardarTurnoCompleto = function() {
    const form = document.getElementById('form-nuevo-turno');
    if (!form) return;

    const pacienteId = document.getElementById('f-turno-paciente').value;
    const profesionalId = document.getElementById('f-turno-profesional').value;
    const sucursalId = document.getElementById('f-turno-sucursal').value;
    const fecha = document.getElementById('f-turno-fecha').value;
    const hora = document.getElementById('f-turno-hora').value;
    const duracion = parseInt(document.getElementById('dur-input').value) || 30;
    const estado = document.getElementById('f-turno-estado').value;
    const esUrgencia = document.getElementById('f-turno-urgencia').checked;
    const motivo = document.getElementById('f-turno-motivo').value.trim();

    const tratamientosSeleccionados = [];
    document.querySelectorAll('#trt-lista input[name="tratamientos_realizados_ids[]"]:checked').forEach(cb => {
      tratamientosSeleccionados.push({
        id: cb.value,
        precio: parseFloat(cb.dataset.precio) || 0
      });
    });

    const coseguro = parseFloat(document.getElementById('coseguro-input').value) || 0;
    const totalPaciente = parseFloat(document.getElementById('inp-total-paciente').value) || 0;
    const totalOS = parseFloat(document.getElementById('inp-total-obra-social').value) || 0;

    if (!pacienteId) return alert('Selecciona un paciente.');
    if (!profesionalId) return alert('Selecciona un profesional.');
    if (!sucursalId) return alert('Selecciona una sucursal.');
    if (!fecha || !hora) return alert('Completa fecha y hora.');

    const pacienteNombre = document.getElementById('f-turno-paciente').options[document.getElementById('f-turno-paciente').selectedIndex].text;
    const profesionalNombre = document.getElementById('f-turno-profesional').options[document.getElementById('f-turno-profesional').selectedIndex].text;

    const turnoData = {
      paciente_id: pacienteId,
      paciente: pacienteNombre,
      odontologo_id: profesionalId,
      odontologo: profesionalNombre,
      sucursal_id: sucursalId,
      fecha: fecha,
      hora: hora,
      duracion: duracion,
      estado: estado,
      es_urgencia: esUrgencia,
      motivo_consulta: motivo,
      tratamientos_realizados: tratamientosSeleccionados,
      coseguro: coseguro,
      total_paciente: totalPaciente,
      total_obra_social: totalOS,
      creado: new Date().toISOString()
    };

    db.collection('turnos').add(turnoData)
      .then(() => {
        closeModal();
        showToast('✅ Turno creado exitosamente.');
        renderAgenda();
      })
      .catch(err => {
        alert('❌ Error al crear el turno: ' + err.message);
      });
  };

  let filterCategoria = 'Todos';

  let filterAgendaVirtual = false;
  let allTratamientosData = [];

  function renderTratamientos() {
    const el = $('view-tratamientos');
    el.innerHTML = `
      <div class="page-header">
        <div>
          <div class="page-title">Catálogo de tratamientos</div>

      <!-- Filtros rápidos -->
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
        <button class="btn btn-sm btn-primary" data-filter="Todos" onclick="setFilterEstado('Todos')">Todos</button>
        <button class="btn btn-sm btn-secondary" data-filter="Activos" onclick="setFilterEstado('Activos')">Activos</button>
        <button class="btn btn-sm btn-secondary" data-filter="Inactivos" onclick="setFilterEstado('Inactivos')">Inactivos</button>
        <button class="btn btn-sm btn-secondary" data-filter="AgendaVirtual" onclick="toggleAgendaVirtual()">Agenda virtual</button>
      </div>

      <!-- Lista de tratamientos -->
      <div id="tratamientos-list-container">
        <div class="card"><p class="text-muted">Cargando tratamientos...</p></div>
      </div>
    `;

    // Escuchar cambios en Firestore
    db.collection('tratamientos').orderBy('categoria').orderBy('nombre').onSnapshot(snap => {
      allTratamientosData = [];
      snap.forEach(doc => {
        const data = doc.data();
        allTratamientosData.push({ id: doc.id, ...data });
      });
      actualizarVistaTratamientos();
    });
  }

  function actualizarVistaTratamientos() {
    const container = $('tratamientos-list-container');
    const countEl = $('tratamientos-count');

    // Construir tabs dinámicamente
    const categoriasSet = new Set();
    allTratamientosData.forEach(item => {
      if (item.categoria) categoriasSet.add(item.categoria);
    });
    const categorias = ['Todos', ...Array.from(categoriasSet).sort()];
    const tabsContainer = $('categoria-tabs');
    if (tabsContainer) {
      tabsContainer.innerHTML = categorias.map(cat =>
        `<button class="tab ${filterCategoria === cat ? 'active' : ''}" data-cat="${cat}" onclick="setFilterCategoria('${cat}')">${cat.charAt(0).toUpperCase() + cat.slice(1)}</button>`
      ).join('');
    }

    // Aplicar filtros
    let filtered = allTratamientosData;

    if (filterCategoria !== 'Todos') {
      filtered = filtered.filter(item => item.categoria === filterCategoria);
    }

    if (filterEstado === 'Activos') {
      filtered = filtered.filter(item => item.activo !== false);
    } else if (filterEstado === 'Inactivos') {
      filtered = filtered.filter(item => item.activo === false);
    }

    if (filterAgendaVirtual) {
      filtered = filtered.filter(item => item.agenda_virtual === true);
    }

    if (countEl) {
      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'tratamiento' : 'tratamientos'}`;
    }

    if (filtered.length === 0) {
      container.innerHTML = `<div class="card"><p class="text-muted">No hay tratamientos que coincidan con los filtros.</p></div>`;
      return;
    }

    let html = `
      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-wrap">
          <table class="table" style="margin-bottom:0;">
            <thead style="background:var(--bg);border-bottom:2px solid var(--border);">
              <tr>
                <th style="width:5%;">#</th>
                <th style="width:30%;">TRATAMIENTO</th>
                <th style="width:15%;">CATEGORÍA</th>
                <th style="width:15%;">PRECIO BASE</th>
                <th style="width:10%;">DURACIÓN</th>
                <th style="width:10%;">ESTADO</th>
                <th style="width:15%;">ACCIONES</th>
              </tr>
            </thead>
            <tbody>
    `;

    filtered.forEach((item, index) => {
      const activo = item.activo !== undefined ? item.activo : true;
      const estadoBadge = activo ? 'badge-green' : 'badge-gray';
      const estadoTexto = activo ? 'Activado' : 'Inactivo';
      const nombreCategoria = (item.categoria || 'Sin categoría').charAt(0).toUpperCase() + (item.categoria || 'sin').slice(1);

      html += `
        <tr>
          <td>${index + 1}</td>
          <td>
            <strong>${item.nombre || ''}</strong>
            <br><small class="text-muted">Cód. ${item.codigo || '—'}</small>
          </td>
          <td>${nombreCategoria}</td>
          <td class="text-end">$${Number(item.precio_base || 0).toLocaleString()}</td>
          <td>${item.duracion || '30 min'}</td>
          <td><span class="badge ${estadoBadge}">${estadoTexto}</span></td>
          <td>
            <button class="btn btn-sm btn-secondary" onclick="openModalEditarTratamiento('${item.id}')" style="margin-right:4px;">✏️ Editar</button>
            <button class="btn btn-sm btn-primary" onclick="openModalOS('${item.id}')">🏥 OS</button>
            <button class="btn btn-sm btn-danger" onclick="eliminarTratamiento('${item.id}')" style="margin-left:4px;">🗑</button>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table></div></div>`;
    container.innerHTML = html;
  }

  // Funciones de filtro
  function setFilterCategoria(cat) {
    filterCategoria = cat;
    actualizarVistaTratamientos();
  }

  function setFilterEstado(estado) {
    filterEstado = estado;
    if (estado !== 'AgendaVirtual') filterAgendaVirtual = false;
    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-secondary');
      if (btn.dataset.filter === estado) {
        btn.classList.remove('btn-secondary');
        btn.classList.add('btn-primary');
      }
    });
    actualizarVistaTratamientos();
  }

  function toggleAgendaVirtual() {
    filterAgendaVirtual = !filterAgendaVirtual;
    const btn = document.querySelector('[data-filter="AgendaVirtual"]');
    if (btn) {
      btn.classList.toggle('btn-primary', filterAgendaVirtual);
      btn.classList.toggle('btn-secondary', !filterAgendaVirtual);
    }
    actualizarVistaTratamientos();
  }

    const categoria = $('f-trat-categoria').value;
    const precio_base = parseFloat($('f-trat-precio').value) || 0;
    const duracion = $('f-trat-duracion').value.trim() || '30 min';
    const activo = $('f-trat-activo').checked;

    if (!nombre) return alert('El nombre es obligatorio.');
    if (!categoria) return alert('Selecciona una categoría.');

    db.collection('tratamientos').add({
      nombre, codigo, categoria, precio_base, duracion, activo,
      precio_os: precio_base, // valor inicial igual al base
      creado: new Date().toISOString()
    }).then(() => {
      closeModal();
      showToast('✅ Tratamiento creado exitosamente.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  // ============================================================
  // MODAL: EDITAR TRATAMIENTO
  // ============================================================
  window.openModalEditarTratamiento = function(id) {
    db.collection('tratamientos').doc(id).get().then(doc => {
      if (!doc.exists) return alert('Tratamiento no encontrado');
      const data = doc.data();
      const categorias = ['cirugia','consulta','diagnostico','endodoncia','estetica','implante','limpieza','odontopediatria','ortodoncia','protesis','restauracion'];
      const opts = categorias.map(c =>
        `<option value="${c}" ${data.categoria === c ? 'selected' : ''}>${c.charAt(0).toUpperCase()+c.slice(1)}</option>`
      ).join('');

      openModal(`
        <div class="modal-title">✏️ Editar tratamiento</div>
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input class="form-control" id="f-trat-edit-nombre" value="${data.nombre || ''}">
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Código</label>
            <input class="form-control" id="f-trat-edit-codigo" value="${data.codigo || ''}">
          </div>
          <div class="form-group">
            <label class="form-label">Categoría *</label>
            <select class="form-control" id="f-trat-edit-categoria">${opts}</select>
          </div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Precio base ($) *</label>
            <input class="form-control" id="f-trat-edit-precio" type="number" step="0.01" value="${data.precio_base || 0}">
          </div>
          <div class="form-group">
            <label class="form-label">Duración</label>
            <input class="form-control" id="f-trat-edit-duracion" value="${data.duracion || '30 min'}">
          </div>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="f-trat-edit-activo" ${data.activo !== false ? 'checked' : ''}> Activo
          </label>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarEdicionTratamiento('${id}')">Actualizar</button>
        </div>
      `);
    });
  };

  window.guardarEdicionTratamiento = function(id) {
    const nombre = $('f-trat-edit-nombre').value.trim();
    const codigo = $('f-trat-edit-codigo').value.trim();
    const categoria = $('f-trat-edit-categoria').value;
    const precio_base = parseFloat($('f-trat-edit-precio').value) || 0;
    const duracion = $('f-trat-edit-duracion').value.trim() || '30 min';
    const activo = $('f-trat-edit-activo').checked;

    if (!nombre) return alert('El nombre es obligatorio.');
    if (!categoria) return alert('Selecciona una categoría.');

    db.collection('tratamientos').doc(id).update({
      nombre, codigo, categoria, precio_base, duracion, activo
    }).then(() => {
      closeModal();
      showToast('✅ Tratamiento actualizado.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  // ============================================================
  // MODAL: ACTUALIZAR PRECIO OS (OBRA SOCIAL)
  // ============================================================
  window.openModalOS = function(id) {
    db.collection('tratamientos').doc(id).get().then(doc => {
      if (!doc.exists) return alert('Tratamiento no encontrado');
      const data = doc.data();
      const precioActual = data.precio_os !== undefined ? data.precio_os : data.precio_base;

      openModal(`
        <div class="modal-title">🏥 Actualizar precio para Obra Social</div>
        <div style="margin-bottom:16px;">
          <div><strong>${data.nombre || ''}</strong></div>
          <div class="text-muted" style="font-size:13px;">Precio base actual: $${Number(data.precio_base || 0).toLocaleString()}</div>
        </div>
        <div class="form-group">
          <label class="form-label">Nuevo precio OS ($)</label>
          <input class="form-control" id="f-os-precio" type="number" step="0.01" value="${precioActual}" min="0">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="guardarOS('${id}')">Guardar precio OS</button>
        </div>
      `);
    });
  };

  window.guardarOS = function(id) {
    const nuevoPrecio = parseFloat($('f-os-precio').value);
    if (isNaN(nuevoPrecio) || nuevoPrecio < 0) {
      return alert('Ingresa un número válido (mayor o igual a 0)');
    }
    db.collection('tratamientos').doc(id).update({
      precio_os: nuevoPrecio
    }).then(() => {
      closeModal();
      showToast('✅ Precio OS actualizado correctamente.');
    }).catch(err => alert('❌ Error: ' + err.message));
  };

  // ============================================================
  // ELIMINAR TRATAMIENTO
  // ============================================================
  window.eliminarTratamiento = function(id) {
    if (!confirm('¿Eliminar este tratamiento de forma permanente?')) return;
    db.collection('tratamientos').doc(id).delete()
      .then(() => showToast('🗑 Tratamiento eliminado.'))
      .catch(err => alert('❌ Error: ' + err.message));
  };

  // ============================================================
  // ESPECIALIDADES
  // ============================================================
  function renderEspecialidades() {
    const el = $('view-especialidades');
    el.innerHTML = `
      <div class="page-header"><div><div class="page-title">Especialidades</div></div>
        <button class="btn btn-primary" onclick="openModalNuevaEspecialidad()">+ Nueva especialidad</button>
      </div>
      <div class="card"><div id="especialidades-list"><p class="text-muted">Cargando...</p></div></div>
    `;
    db.collection('especialidades').orderBy('nombre').onSnapshot(snap => {
      let html = '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th></th></tr></thead><tbody>';
      snap.forEach(d => {
        const data = d.data();
        html += `<tr><td>${data.nombre||''}</td>
          <td><button class="btn btn-sm btn-danger" onclick="eliminarEspecialidad('${d.id}')">Eliminar</button></td></tr>`;
      });
      html += '</tbody></table></div>';
      $('especialidades-list').innerHTML = html || '<p class="text-muted">Sin especialidades</p>';
    });
  }

  window.openModalNuevaEspecialidad = function() {
    openModal(`
      <div class="modal-title">Nueva especialidad</div>
      <div class="form-group"><label class="form-label">Nombre</label><input class="form-control" id="f-esp-nombre"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarEspecialidad()">Guardar</button></div>
    `);
  };

  window.guardarEspecialidad = function() {
    const nombre = $('f-esp-nombre').value.trim();
    if (!nombre) return alert('Nombre requerido');
    db.collection('especialidades').add({ nombre })
      .then(() => { closeModal(); showToast('Guardado'); });
  };

  window.eliminarEspecialidad = function(id) {
    if (!confirm('¿Eliminar?')) return;
    db.collection('especialidades').doc(id).delete().then(() => showToast('Eliminado'));
  };

  // ============================================================
  // WEB
  // ============================================================
  function renderWeb() {
    $('view-web').innerHTML = `
      <div class="page-header"><div><div class="page-title">Landing page</div><div class="page-subtitle">Configuración de la página pública</div></div></div>
      <div class="card">
        <div class="form-group"><label class="form-label">Tagline</label><input class="form-control" id="web-tagline" placeholder="Tu sonrisa, nuestra pasión"></div>
        <div class="form-group"><label class="form-label">Descripción</label><textarea class="form-control" id="web-desc" rows="3"></textarea></div>
        <button class="btn btn-primary" onclick="guardarWeb()">Guardar</button>
      </div>
    `;
    db.collection('landing_config').doc('main').get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        $('web-tagline').value = data.tagline||'';
        $('web-desc').value = data.descripcion||'';
      }
    });
  }

  window.guardarWeb = function() {
    const tagline = $('web-tagline').value.trim();
    const descripcion = $('web-desc').value.trim();
    db.collection('landing_config').doc('main').set({ tagline, descripcion, updated: new Date().toISOString() })
      .then(() => showToast('Configuración guardada'));
  };

  // ============================================================
  // WHATSAPP
  // ============================================================
  function renderWhatsApp() {
    $('view-whatsapp').innerHTML = `
      <div class="page-header"><div><div class="page-title">WhatsApp</div><div class="page-subtitle">Configuración</div></div></div>
      <div class="card">
        <div class="form-group"><label class="form-label">Proveedor</label><select class="form-control" id="wp-proveedor"><option value="evolution">Evolution API</option><option value="meta">Meta (Oficial)</option></select></div>
        <div class="form-group"><label class="form-label">API Key / Token</label><input class="form-control" id="wp-token" placeholder="Token"></div>
        <div class="form-group"><label class="form-label">Mensaje automático</label><textarea class="form-control" id="wp-mensaje" rows="2">Hola {nombre}, recibimos tu mensaje.</textarea></div>
        <button class="btn btn-primary" onclick="guardarWhatsApp()">Guardar</button>
      </div>
    `;
    db.collection('whatsapp_config').doc('main').get().then(doc => {
      if (doc.exists) {
        const data = doc.data();
        $('wp-proveedor').value = data.proveedor||'evolution';
        $('wp-token').value = data.token||'';
        $('wp-mensaje').value = data.mensaje_auto||'';
      }
    });
  }

  window.guardarWhatsApp = function() {
    const proveedor = $('wp-proveedor').value;
    const token = $('wp-token').value.trim();
    const mensaje_auto = $('wp-mensaje').value.trim();
    db.collection('whatsapp_config').doc('main').set({ proveedor, token, mensaje_auto, updated: new Date().toISOString() })
      .then(() => showToast('Configuración guardada'));
  };

  // ============================================================
  // CONFIGURACIÓN
  // ============================================================
  function renderConfiguracion() {
    $('view-configuracion').innerHTML = `
      <div class="page-header"><div><div class="page-title">Configuración</div><div class="page-subtitle">Sucursales y horarios</div></div></div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px"><span style="font-weight:700">Sucursales</span><button class="btn btn-primary btn-sm" onclick="openModalNuevaSucursal()">+ Agregar</button></div>
        <div id="sucursales-list"><p class="text-muted">Cargando...</p></div>
      </div>
      <div class="card">
        <div class="form-group"><label class="form-label">Zona horaria</label><select class="form-control" id="cfg-timezone"><option value="America/Argentina/Buenos_Aires">UTC-03:00 Buenos Aires</option><option value="UTC">UTC</option></select></div>
        <button class="btn btn-primary" onclick="guardarConfiguracion()">Guardar</button>
      </div>
    `;
    db.collection('sucursales').orderBy('nombre').onSnapshot(snap => {
      let html = '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Dirección</th><th></th></tr></thead><tbody>';
      snap.forEach(d => {
        const data = d.data();
        html += `<tr><td>${data.nombre||''}</td><td>${data.direccion||''}</td>
          <td><button class="btn btn-sm btn-danger" onclick="eliminarSucursal('${d.id}')">Eliminar</button></td></tr>`;
      });
      html += '</tbody></table></div>';
      $('sucursales-list').innerHTML = html || '<p class="text-muted">Sin sucursales</p>';
    });
    db.collection('configuracion').doc('main').get().then(doc => {
      if (doc.exists) $('cfg-timezone').value = doc.data().timezone||'America/Argentina/Buenos_Aires';
    });
  }

  window.openModalNuevaSucursal = function() {
    openModal(`
      <div class="modal-title">Nueva sucursal</div>
      <div class="form-group"><label class="form-label">Nombre</label><input class="form-control" id="f-suc-nombre"></div>
      <div class="form-group"><label class="form-label">Dirección</label><input class="form-control" id="f-suc-direccion"></div>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarSucursal()">Guardar</button></div>
    `);
  };

  window.guardarSucursal = function() {
    const nombre = $('f-suc-nombre').value.trim();
    const direccion = $('f-suc-direccion').value.trim();
    if (!nombre) return alert('Nombre requerido');
    db.collection('sucursales').add({ nombre, direccion })
      .then(() => { closeModal(); showToast('Guardado'); });
  };

  window.eliminarSucursal = function(id) {
    if (!confirm('¿Eliminar sucursal?')) return;
    db.collection('sucursales').doc(id).delete().then(() => showToast('Eliminado'));
  };

  window.guardarConfiguracion = function() {
    const timezone = $('cfg-timezone').value;
    db.collection('configuracion').doc('main').set({ timezone, updated: new Date().toISOString() })
      .then(() => showToast('Configuración guardada'));
  };

  // ============================================================
  // INICIALIZACIÓN
  // ============================================================
  navigateTo('dashboard');
  $('modal-generic').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

  console.log('Panel DentalSoft completo iniciado con Firebase.');
</script>

</body>
</html>
