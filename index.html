<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Dental · Panel Completo</title>

  <style>
    :root { --primary: #355063; --primary-dark: #1e2d3a; --accent: #4285F4; --accent-dark: #2b6ed7; --accent-light: #e8f0fe; --text: #1e2d3a; --text-muted: #64748b; --bg: #f1f5f9; --border: #e2e8f0; --white: #ffffff; --danger: #dc2626; --success: #16a34a; --warning: #f59e0b; --radius: 8px; --shadow: 0 2px 8px rgba(0,0,0,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    .topnav { background: var(--primary); color: #fff; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; position: sticky; top: 0; z-index: 100; }
    .topnav .logo { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .topnav .logo span { font-weight: 300; }
    .topnav .nav-links { display: flex; gap: 8px; margin-left: 24px; }
    .topnav .nav-links a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: var(--radius); transition: 0.2s; }
    .topnav .nav-links a:hover, .topnav .nav-links a.active { background: rgba(255,255,255,0.15); color: #fff; }
    .topnav .nav-right { display: flex; align-items: center; gap: 16px; }
    .topnav .nav-clinic { font-size: 13px; opacity: 0.8; }
    .topnav .nav-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; }
    .topnav .user-menu-trigger { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .topnav .nav-user-text { text-align: right; line-height: 1.2; }
    .topnav .nav-user-text div:last-child { font-size: 11px; opacity: 0.6; }
    .topnav .user-dropdown { display: none; position: absolute; right: 0; top: 100%; background: #fff; border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.15); min-width: 180px; padding: 8px 0; margin-top: 4px; }
    .topnav .user-dropdown a { display: flex; align-items: center; gap: 8px; padding: 8px 16px; color: var(--text); text-decoration: none; font-size: 13px; }
    .topnav .user-dropdown a:hover { background: var(--bg); }
    .topnav .user-dropdown a.danger { color: var(--danger); }
    .user-menu-wrap { position: relative; }
    .app-layout { display: flex; flex: 1; }
    .sidebar { width: 240px; background: var(--white); border-right: 1px solid var(--border); padding: 16px 0; flex-shrink: 0; overflow-y: auto; height: calc(100vh - 60px); position: sticky; top: 60px; }
    .sidebar .sidebar-section { margin-bottom: 24px; }
    .sidebar .sidebar-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); padding: 0 16px 8px; }
    .sidebar .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; color: var(--text); text-decoration: none; font-size: 14px; border-radius: var(--radius); margin: 0 6px; cursor: pointer; transition: 0.15s; border: none; background: none; width: calc(100% - 12px); text-align: left; }
    .sidebar .sidebar-item:hover { background: var(--bg); }
    .sidebar .sidebar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .sidebar .sidebar-item .icon { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar .sidebar-item .sb-txt { flex: 1; }
    .sidebar-group-row { display: flex; align-items: stretch; }
    .sidebar-group-row > .sidebar-item { flex: 1; min-width: 0; }
    .sidebar-chevron { background: none; border: none; cursor: pointer; padding: 0 8px; color: var(--text-muted); display: flex; align-items: center; flex-shrink: 0; }
    .sidebar-chevron svg { transition: transform 0.2s ease; }
    .sidebar-chevron.open svg { transform: rotate(180deg); }
    .sidebar-subitems { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
    .sidebar-subitems.open { max-height: 200px; }
    .main { flex: 1; padding: 24px 28px; overflow-y: auto; max-height: calc(100vh - 60px); }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: 0.15s; text-decoration: none; line-height: 1.4; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: var(--bg); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-block { width: 100%; justify-content: center; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; background: var(--white); transition: 0.15s; }
    .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66,133,244,0.15); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .view { display: none; }
    .view.active { display: block; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #fff; border-radius: var(--radius); max-width: 700px; width: 100%; padding: 24px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .ds-reprog-mode #cal-wrap { outline: 3px solid #f59e0b; outline-offset: -3px; border-radius: 12px; }
    @media (max-width: 768px) { .sidebar { width: 60px; padding: 12px 0; } .sidebar .sb-txt { display: none; } .sidebar .sidebar-item { justify-content: center; padding: 10px; } .main { padding: 16px; } .form-grid { grid-template-columns: 1fr; } .topnav .nav-links { display: none; } }
  </style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topnav">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="logo">Dental<span>Soft</span></div>
    <div class="nav-links">
      <a href="#" class="active" data-view="dashboard">Dashboard</a>
      <a href="#" data-view="agenda">Agenda</a>
      <a href="#" data-view="pacientes">Pacientes</a>
      <a href="#" data-view="caja">Caja</a>
      <a href="#" data-view="automatizaciones">Automatizaciones</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="nav-clinic">Clínica Dental Demo</div>
    <div class="user-menu-wrap">
      <div class="user-menu-trigger" onclick="toggleUserMenu()">
        <div class="nav-avatar">AD</div>
        <div class="nav-user-text"><div>Admin Demo</div><div>admin</div></div>
      </div>
      <div class="user-dropdown" id="user-dropdown">
        <a href="#" data-view="configuracion">Configuración</a>
        <a href="#" class="danger" onclick="cerrarSesion()">Cerrar sesión</a>
      </div>
    </div>
  </div>
</nav>

<!-- LAYOUT -->
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Principal</div>
      <button class="sidebar-item active" data-view="dashboard">Dashboard</button>
      <button class="sidebar-item" data-view="agenda">Agenda</button>
      <button class="sidebar-item" data-view="pacientes">Pacientes</button>
      <button class="sidebar-item" data-view="profesionales">Profesionales</button>
      <button class="sidebar-item" data-view="liquidaciones">Liquidaciones</button>
      <button class="sidebar-item" data-view="automatizaciones">Automatizaciones</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Finanzas</div>
      <button class="sidebar-item" data-view="caja">Caja</button>
      <button class="sidebar-item" data-view="presupuestos">Presupuestos</button>
      <button class="sidebar-item" data-view="productividad">Productividad</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Clínica</div>
      <button class="sidebar-item" data-view="obras_sociales">Obras sociales</button>
      <button class="sidebar-item" data-view="inventario">Inventario</button>
      <button class="sidebar-item" data-view="tratamientos">Tratamientos</button>
      <button class="sidebar-item" data-view="especialidades">Especialidades</button>
      <button class="sidebar-item" data-view="web">Web</button>
      <button class="sidebar-item" data-view="whatsapp">WhatsApp</button>
      <button class="sidebar-item" data-view="configuracion">Configuración</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <div id="view-dashboard" class="view active"></div>

    <!-- VISTA AGENDA -->
    <div id="view-agenda" class="view">
      <div class="page-header">
        <div>
          <div class="page-title">Agenda</div>
          <div class="page-subtitle" id="agenda-subtitle">Semana del <span id="semana-label">...</span></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button onclick="cambiarSemana(-1)" class="btn btn-secondary btn-sm">← Anterior</button>
          <button onclick="irHoy()" class="btn btn-secondary btn-sm">Hoy</button>
          <button onclick="cambiarSemana(1)" class="btn btn-secondary btn-sm">Siguiente →</button>
          <a href="#/crear-turno" class="btn btn-primary btn-sm">+ Nuevo turno</a>
          <button onclick="document.getElementById('modal-bloqueo').style.display='flex'" class="btn btn-secondary btn-sm">🔒 Bloquear</button>
        </div>
      </div>
      <div id="cal-wrap" style="background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;"></div>
    </div>
  </main>
</div>

<!-- MODALES -->
<!-- Popup de turno -->
<div id="turno-popup" style="display:none;position:fixed;z-index:4000;width:300px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.2);overflow:hidden;"></div>
<!-- Modal eliminar -->
<div id="confirm-eliminar-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8000;align-items:center;justify-content:center;padding:20px"></div>
<!-- Modal bloquear -->
<div id="modal-bloqueo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5000;align-items:center;justify-content:center"></div>

<!-- NUEVO MODAL PARA CREAR TURNOS -->
<div id="modal-nuevo-turno" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9000; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto;">
  <div class="card" style="max-width:800px; width:100%; background:#fff; margin-top:30px; box-shadow:0 20px 60px rgba(0,0,0,.25);">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:15px; margin-bottom:20px;">
      <div class="page-title" style="font-size:18px;">Nuevo turno</div>
      <button onclick="cerrarModalNuevoTurno()" class="btn btn-secondary btn-sm">✕ Cerrar</button>
    </div>
    <form id="form-nuevo-turno" onsubmit="event.preventDefault(); guardarNuevoTurno();">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Paciente *</label>
          <select name="paciente_id" id="paciente-select" class="form-control" onchange="handleManualInput('paciente')" required>
            <option value="">— Seleccionar paciente —</option>
            <option value="manual">✍️ Escribir manualmente</option>
          </select>
          <input type="text" id="paciente-manual" style="display:none; margin-top:6px;" class="form-control" placeholder="Nombre del paciente">
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Profesional *</label>
          <select name="odontologo_id" id="odontologo-select" class="form-control" onchange="handleManualInput('odontologo')" required>
            <option value="">— Seleccionar profesional —</option>
            <option value="manual">✍️ Escribir manualmente</option>
          </select>
          <input type="text" id="odontologo-manual" style="display:none; margin-top:6px;" class="form-control" placeholder="Nombre del profesional">
        </div>
        <div class="form-group">
          <label class="form-label">Fecha *</label>
          <input type="date" name="fecha" id="input-fecha" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Hora de inicio *</label>
          <input type="time" name="hora_inicio" id="input-hora" class="form-control" step="900" value="09:00" required>
        </div>
        <div class="form-group">
          <label class="form-label">Duración *</label>
          <div style="display:flex; align-items:center; gap:6px;">
            <select id="dur-select" class="form-control" style="width:130px" onchange="document.getElementById('dur-input').value=this.value;">
              <option value="15">15 min</option>
              <option value="30" selected>30 min</option>
              <option value="45">45 min</option>
              <option value="60">60 min</option>
            </select>
            <input type="number" name="duracion_minutos" id="dur-input" class="form-control" style="width:72px" min="15" step="1" value="30" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select name="estado" id="estado-select" class="form-control">
            <option value="pendiente" selected>Pendiente</option>
            <option value="confirmado">Confirmado</option>
          </select>
        </div>
        <div style="grid-column:1/-1; margin-bottom:14px; padding:12px; border-radius:10px; background:#f8fafc; border:1px solid var(--border);">
          <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
            <input type="checkbox" name="es_urgencia" id="check-urgencia" style="width:16px; height:16px;">
            <div><div style="font-weight:700; font-size:13px;">⚡ Urgencia / Sobreturno</div></div>
          </label>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label class="form-label">Motivo de consulta</label>
          <textarea name="motivo_consulta" id="input-motivo" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:10px;">
        <div style="font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px;">Tratamientos realizados</div>
        <div id="tratamientos-lista" style="max-height:200px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; margin-bottom:10px;"></div>
        <div style="display:flex; justify-content:space-between; font-weight:700; font-size:14px;">
          <span>Total seleccionado:</span>
          <span style="color:var(--primary);">$<span id="trt-total-val">0</span></span>
        </div>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:20px; border-top:1px solid var(--border); padding-top:16px;">
        <button type="button" onclick="cerrarModalNuevoTurno()" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear turno</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal genérico -->
<div class="modal-overlay" id="modal-generic"><div class="modal-box" id="modal-generic-content"></div></div>
<!-- Toast -->
<div id="notif" style="position:fixed;bottom:20px;right:20px;z-index:9999;"></div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<!-- ARCHIVOS JS -->
<script src="js/config.js"></script>
<script src="js/navigation.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/agenda.js"></script>
<script src="js/pacientes.js"></script>
<script src="js/profesionales.js"></script>
<script src="js/liquidaciones.js"></script>
<script src="js/automatizaciones.js"></script>
<script src="js/caja.js"></script>
<script src="js/presupuestos.js"></script>
<script src="js/productividad.js"></script>
<script src="js/obras_sociales.js"></script>
<script src="js/liquidaciones_os.js"></script>
<script src="js/inventario.js"></script>
<script src="js/proveedores.js"></script>
<script src="js/tratamientos.js"></script>
<script src="js/especialidades.js"></script>
<script src="js/web.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/configuracion.js"></script>

</body>
</html>
